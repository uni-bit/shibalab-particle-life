      p.setPipeline(CP.key); p.setBindGroup(0, BG.key); p.dispatchWorkgroups(g256);
      p.setPipeline(CP.scanA); p.setBindGroup(0, BG.scanAN); p.dispatchWorkgroups(nbN);
      p.setBindGroup(0, BG.scanAH); p.dispatchWorkgroups(nbH);
      p.setPipeline(CP.scanB); p.setBindGroup(0, BG.scanBN); p.dispatchWorkgroups(1);
      p.setBindGroup(0, BG.scanBH); p.dispatchWorkgroups(1);
      p.setPipeline(CP.scanC); p.setBindGroup(0, BG.scanCN); p.dispatchWorkgroups(nbN);
      p.setBindGroup(0, BG.scanCH); p.dispatchWorkgroups(nbH);
      p.setPipeline(CP.scatter); p.setBindGroup(0, BG.scatter); p.dispatchWorkgroups(g256);
      const nW = Math.ceil(n / 32);
      p.setPipeline(CP.force); p.setBindGroup(0, BG.force);

  };

  /* ---------------- 描画 (renderer のインターフェイス) ---------------- */
  function applyStyle() {
    const size = Math.fround(params.pointSize * dpr);    // WebGL 版の gl_PointSize と同じ大きさ (px)
    // 四隅のずらし量 (クリップ座標)。WebGL (ANGLE) が点を四角形に広げるときと同じ順・同じ丸めで計算する
    // (0.5 × (1 / (画面の半分の大きさ)) × 大きさ)。丸めが違うと頂点が 1/256 画素の格子で別の位置に寄ることがある
    const f = Math.fround, half = (px) => f(f(0.5 * f(1 / f(px * 0.5))) * size);
    ruF[2] = half(pxW); ruF[3] = half(pxH); ruF[4] = params.pointAlpha;
    for (let t = 0; t < MAX_TYPES; t++) {
      colIo[t * 4] = TYPE_COLORS[t * 3]; colIo[t * 4 + 1] = TYPE_COLORS[t * 3 + 1]; colIo[t * 4 + 2] = TYPE_COLORS[t * 3 + 2];
    }

  }
  const renderer = {
    name: 'WebGPU',
    device,
    applyStyle,
    resize(w, h, newDpr) {
      dpr = newDpr;
      const maxTex = device.limits.maxTextureDimension2D;   // これを超える大きさは作れない (WebGL と同じく縮める)
      canvas.width = pxW = Math.max(1, Math.min(maxTex, Math.round(w * dpr)));
      canvas.height = pxH = Math.max(1, Math.min(maxTex, Math.round(h * dpr)));
      ruF[0] = w; ruF[1] = h;
      applyStyle();
      if (trail) trail.destroy();

      blitBG = device.createBindGroup({ layout: blitPipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: trail.createView() }] });
      const enc = device.createCommandEncoder();          // 黒で塗る (WebGL 版の gl.clear と同じ)
      enc.beginRenderPass({ colorAttachments: [{ view: trail.createView(), loadOp: 'clear', clearValue: [0, 0, 0, 1], storeOp: 'store' }] }).end();

      fadeIo[0] = TRAIL_FLOOR; fadeIo[1] = TRAIL_FLOOR; fadeIo[2] = TRAIL_FLOOR; fadeIo[3] = 0;
      device.queue.writeBuffer(fadeBuf[1], 0, fadeIo);

      const pass = enc.beginRenderPass({ colorAttachments: [{ view: trail.createView(), loadOp: 'load', storeOp: 'store' }] });

      pass.setPipeline(fadeMulPipe); pass.setBindGroup(0, fadeBG[0]); pass.draw(4);
      pass.setPipeline(fadeSubPipe); pass.setBindGroup(0, fadeBG[1]); pass.draw(4);

      if (n > 0) { pass.setPipeline(pointPipe); pass.setBindGroup(0, pointBG); pass.draw(4, n); }
      pass.end();
      // 上下を戻してキャンバスへ (全画面を上書きするので読み込み不要)
      const bp = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', clearValue: [0, 0, 0, 1], storeOp: 'store' }] });
      bp.setPipeline(blitPipe); bp.setBindGroup(0, blitBG); bp.draw(4); bp.end();
      device.queue.submit([enc.finish()]);

  if (err) {
    console.warn('WebGPU のシェーダを作れません (WebGL を使います):', err.message);
    device.destroy();
    return null;
  }
  ctx = canvas.getContext('webgpu');
  if (!ctx) { device.destroy(); return null; }
  ctx.configure({ device, format: FORMAT, alphaMode: 'opaque', usage: GPUTextureUsage.RENDER_ATTACHMENT });
  return { renderer, sim };
}

function createCanvas2DRenderer() {
  const ctx = canvas.getContext('2d', { alpha: false });
  const styles = [];
  function applyStyle() {
    styles.length = 0;
    for (let t = 0; t < numTypes; t++) {
      const r = TYPE_COLORS[t * 3] * 255 | 0, g = TYPE_COLORS[t * 3 + 1] * 255 | 0, b = TYPE_COLORS[t * 3 + 2] * 255 | 0;
      styles.push(`rgba(${r},${g},${b},${params.pointAlpha})`);
    }
  }
  applyStyle();
  let w = 1, h = 1;
  return {
    name: 'Canvas2D',
    applyStyle,
    resize(newW, newH, dpr) {
      w = newW; h = newH;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
    },
    onCountChanged() {},
    draw(n) {
      const s = params.pointSize * 0.5, hs = s / 2;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = `rgba(0,0,0,${params.trailFade})`;
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'lighter';
      // fillStyle の切り替えを減らすためタイプごとにまとめて描く
      for (let t = 0; t < numTypes; t++) {
        ctx.fillStyle = styles[t];
        for (let i = 0; i < n; i++) {
          if (type[i] === t) ctx.fillRect(posX[i] - hs, posY[i] - hs, s, s);
        }
      }
    },
  };
}

// 描画・GPU 計算は起動処理 (boot) で決める (WebGPU の準備は非同期)。それまでは何もしない仮の描画先
let renderer = { name: '', applyStyle() {}, resize() {}, onCountChanged() {}, draw() {} };
/** 使える中で一番速い描画・計算を選ぶ: WebGPU → WebGL2 (+GPU 計算) → WebGL1 → Canvas2D。
 *  URL に ?gl=1 を付けると WebGPU を使わない (比較・確認用) */
async function chooseBackend() {
  if (!/[?&]gl=1/.test(location.search)) {
    try {
      const wg = await createWebGPUBackend();
      if (wg) { renderer = wg.renderer; gpu = wg.sim; return; }
    } catch (e) { console.warn('WebGPU 初期化失敗 (WebGL を使います):', e); }
  }
  let r = null;
  try { r = createWebGLRenderer(); } catch (e) { console.warn('WebGL 初期化失敗:', e); r = null; }
  renderer = r || createCanvas2DRenderer();
  if (renderer.isGL2) {
    try { gpu = createGpuSim(renderer); } catch (e) { console.warn('GPU 計算の初期化失敗 (CPU で計算します):', e); gpu = null; }
  }
}

/* =====================================================================
 *  UI
 * ===================================================================== */
const $ = (id) => document.getElementById(id);
const ui = {
  panel: $('panel'), count: $('count'), countVal: $('countVal'),
  rmax: $('rmax'), rmaxVal: $('rmaxVal'), friction: $('friction'), frictionVal: $('frictionVal'),
  types: $('types'), typesVal: $('typesVal'), speed: $('speed'), speedVal: $('speedVal'),
  fps: $('fps'), notice: $('notice'), matrix: $('matrix'), matrixInfo: $('matrixInfo'), ring: $('ring'),
  btnPause: $('btnPause'),
};

function setupSlider(el, min, max, stepSize, value) {
  el.min = min; el.max = max; el.step = stepSize; el.value = value;
}
// 粒子数スライダーは対数目盛 (少ない側も多い側も同じ感覚で動かせるように)
const COUNT_STEPS = 1000;
const countFromSlider = (v) => {
  const c = MIN_COUNT * Math.pow(maxCount() / MIN_COUNT, v / COUNT_STEPS);
  const unit = c < 10000 ? 100 : 1000;
  return Math.round(c / unit) * unit;
};
const sliderFromCount = (c) => Math.round(Math.log(c / MIN_COUNT) / Math.log(maxCount() / MIN_COUNT) * COUNT_STEPS);
setupSlider(ui.count, 0, COUNT_STEPS, 1, 0);   // 位置は起動時に refreshLabels で合わせる
setupSlider(ui.rmax, MIN_RMAX, MAX_RMAX, 1, DEFAULT_RMAX);
setupSlider(ui.friction, MIN_HALF_LIFE, MAX_HALF_LIFE, 0.005, DEFAULT_HALF_LIFE);
setupSlider(ui.types, 1, MAX_TYPES, 1, DEFAULT_TYPES);
setupSlider(ui.speed, 1, MAX_SPEED, 1, 1);
// 実際に回すステップ数 (重いときは粒子数を減らす前にまずこれを下げる。軽くなれば戻す)
let speedNow = 1;
function setSpeed(v) {
  params.speed = Math.max(1, Math.min(MAX_SPEED, v | 0));
  speedNow = params.speed;
  refreshLabels();
}
ui.speed.addEventListener('input', () => setSpeed(+ui.speed.value));

function refreshLabels() {
  ui.count.value = sliderFromCount(params.count);
  ui.countVal.textContent = params.count;
  ui.rmaxVal.textContent = Math.round(params.rMax) + ' px';
  ui.frictionVal.textContent = params.halfLife.toFixed(3) + ' 秒';
  ui.types.value = numTypes;
  ui.typesVal.textContent = numTypes;
  ui.speed.value = params.speed;
  ui.speedVal.textContent = '×' + params.speed + (speedNow < params.speed ? ` (負荷軽減中 ×${speedNow})` : '');
  ui.btnPause.textContent = params.paused ? '再開' : '一時停止';
}

ui.count.addEventListener('input', () => {
  setCountAndDensity(countFromSlider(+ui.count.value));
  ui.countVal.textContent = params.count;   // つまみは触っている位置のまま
});
ui.rmax.addEventListener('input', () => { params.rMaxSetting = +ui.rmax.value; rebuildGrid(); refreshLabels(); });
ui.friction.addEventListener('input', () => { params.halfLife = +ui.friction.value; refreshLabels(); });

// 行列: 先頭行・先頭列はタイプの色。行 = 動く側, 列 = 相手。正 = 緑 (引き寄せられる), 負 = 赤 (離れる)
// セルを上下にドラッグ (上 = 引き寄せる / 下 = 離れる)、ホイールで微調整、ダブルクリックで 0
const matrixCells = [];
const typeCss = (t) => `rgb(${TYPE_COLORS[t*3]*255|0},${TYPE_COLORS[t*3+1]*255|0},${TYPE_COLORS[t*3+2]*255|0})`;
const MATRIX_DRAG_PX = 90;          // 何 px ドラッグで値が 1 変わるか
let matrixHover = -1, matrixDrag = null;
// 編集対象: force = 力の係数 / max = 組ごとの最大距離 / min = 組ごとの反発距離
let matrixMode = 'force';
const MATRIX_MODES = {
  force: { get: (k) => matrix[k], set: (k, v) => setMatrixValue(k, v), wheel: 0.05, def: () => 0 },
  max:   { get: (k) => pairMax[k], set: (k, v) => setPairRange(pairMax, k, v, 0.1, 1), wheel: 0.05, def: () => 1 },
  min:   { get: (k) => pairMin[k], set: (k, v) => setPairRange(pairMin, k, v, 0.05, 0.9), wheel: 0.02, def: () => params.beta },
};
const curMode = () => MATRIX_MODES[matrixMode];
document.getElementById('matrixMode').addEventListener('click', (e) => {
  const m = e.target.dataset && e.target.dataset.mode;
  if (!m || !MATRIX_MODES[m]) return;
  matrixMode = m;
  for (const b of e.currentTarget.querySelectorAll('button')) b.classList.toggle('on', b.dataset.mode === m);
  refreshMatrixView();
});

function buildMatrixGrid() {
  ui.matrix.textContent = '';
  matrixCells.length = 0;
  matrixHover = -1; matrixDrag = null;
  ui.matrix.classList.remove('editing');
  ui.matrix.style.gridTemplateColumns = `repeat(${numTypes + 1}, 1fr)`;
  ui.matrix.appendChild(document.createElement('div')); // 左上の空白
  for (let j = 0; j < numTypes; j++) {
    const d = document.createElement('div'); d.className = 'head'; d.style.background = typeCss(j);
    ui.matrix.appendChild(d);
  }
  for (let i = 0; i < numTypes; i++) {
    const h = document.createElement('div'); h.className = 'head'; h.style.background = typeCss(i);
    ui.matrix.appendChild(h);
    for (let j = 0; j < numTypes; j++) {
      const d = document.createElement('div');
      const k = i * numTypes + j;
      d.className = 'cell';
      d.addEventListener('pointerenter', () => { matrixHover = k; refreshMatrixInfo(); });
      d.addEventListener('pointerleave', () => { if (matrixHover === k) matrixHover = -1; refreshMatrixInfo(); });
      d.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        d.setPointerCapture(e.pointerId);
        matrixDrag = { k, y0: e.clientY, v0: curMode().get(k) };
        if (matrixMode === 'force') setMatrixValue(k, matrix[k]);   // 補間中ならここで止める
        d.classList.add('active'); ui.matrix.classList.add('editing');
        refreshMatrixView();
      });
      d.addEventListener('pointermove', (e) => {
        if (!matrixDrag || matrixDrag.k !== k) return;
        const v = matrixDrag.v0 + (matrixDrag.y0 - e.clientY) / MATRIX_DRAG_PX;
        curMode().set(k, Math.round(v * 100) / 100);
        refreshMatrixView();
      });
      const end = () => {
        if (!matrixDrag || matrixDrag.k !== k) return;
        matrixDrag = null;
        d.classList.remove('active'); ui.matrix.classList.remove('editing');
        refreshMatrixView();
      };
      d.addEventListener('pointerup', end);
      d.addEventListener('pointercancel', end);
      d.addEventListener('wheel', (e) => {
        e.preventDefault();
        curMode().set(k, Math.round((curMode().get(k) - Math.sign(e.deltaY) * curMode().wheel) * 100) / 100);
        refreshMatrixView();
      }, { passive: false });
      d.addEventListener('dblclick', () => { curMode().set(k, curMode().def()); refreshMatrixView(); });
      ui.matrix.appendChild(d); matrixCells.push(d);
    }
  }
}
buildMatrixGrid();

function refreshMatrixView() {
  for (let k = 0; k < matrixCells.length; k++) {
    const dragging = matrixDrag && matrixDrag.k === k;
    if (matrixMode === 'force') {
      const v = matrix[k], a = Math.abs(v).toFixed(2);
      matrixCells[k].style.background = v >= 0 ? `rgba(90,220,130,${a})` : `rgba(240,80,90,${a})`;
      // ドラッグ中のセルだけ数値を出す
      matrixCells[k].textContent = dragging ? (v >= 0 ? '+' : '') + v.toFixed(2) : '';
    } else if (matrixMode === 'max') {
      const v = pairMax[k];
      matrixCells[k].style.background = `rgba(110,170,255,${(0.12 + 0.88 * (v - 0.1) / 0.9).toFixed(2)})`;
      matrixCells[k].textContent = dragging ? Math.round(v * params.rMax) : '';
    } else {
      const v = pairMin[k];
      matrixCells[k].style.background = `rgba(255,185,90,${(0.12 + 0.88 * (v - 0.05) / 0.85).toFixed(2)})`;
      matrixCells[k].textContent = dragging ? Math.round(v * pairMax[k] * params.rMax) : '';
    }
  }
  refreshMatrixInfo();
}

/** 行列の下の説明: 「●は ● に 引き寄せられる +0.42」 */
function refreshMatrixInfo() {
  const k = matrixDrag ? matrixDrag.k : matrixHover;
  if (k < 0) {
    ui.matrixInfo.innerHTML = matrixMode === 'force'
      ? '<span class="hint">↑ドラッグ 引き寄せ / ↓ 離れる / ダブルクリック 0</span>'
      : matrixMode === 'max'
        ? '<span class="hint">↑ドラッグ 遠くまで届く / ↓ 近くだけ / ダブルクリック 最大</span>'
        : '<span class="hint">↑ドラッグ 反発が広い / ↓ 狭い / ダブルクリック 初期値</span>';
    return;
  }
  const i = (k / numTypes) | 0, j = k % numTypes, v = matrix[k];
  if (matrixMode !== 'force') {
    const R = params.rMax * pairMax[k];
    const txt = matrixMode === 'max'
      ? `が影響を受ける距離 〜${Math.round(R)}px<span class="val" style="color:#8bf">${Math.round(pairMax[k] * 100)}%</span>`
      : `に近すぎて反発する距離 〜${Math.round(R * pairMin[k])}px<span class="val" style="color:#fc8">${Math.round(pairMin[k] * 100)}%</span>`;
    ui.matrixInfo.innerHTML =
      `<span class="dot" style="background:${typeCss(i)}"></span>が` +
      `<span class="dot" style="background:${typeCss(j)}"></span>${txt}`;
    return;
  }
  const word = Math.abs(v) < 0.05 ? 'を気にしない' : v > 0 ? (v > 0.5 ? 'に強く引き寄せられる' : 'に引き寄せられる')
                                                          : (v < -0.5 ? 'から強く離れる' : 'から離れる');
  ui.matrixInfo.innerHTML =
    `<span class="dot" style="background:${typeCss(i)}"></span>は` +
    `<span class="dot" style="background:${typeCss(j)}"></span>${word}` +
    `<span class="val" style="color:${v >= 0 ? '#7d8' : '#f78'}">${v >= 0 ? '+' : ''}${v.toFixed(2)}</span>`;
}

/* ---- プリセット (どれも params.lerpTime 秒かけて滑らかに移る) ---- */
const PRESETS = {
  random: null,                                   // startCreation と同じ
  self(m) {      // 同じ色どうしで集まり、違う色は少し避ける
    const N = numTypes;
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) m[i * N + j] = i === j ? 0.8 : -0.3;
  },
  chase(m) {     // 各色は次の色を追いかけ、追われる側は逃げる → 色の帯が回り続ける
    m.fill(0);
    const N = numTypes;
    for (let i = 0; i < N; i++) {
      const next = (i + 1) % N;
      m[i * N + i] = 0.3;
      if (next === i) continue;          // 1色だけのとき
      m[i * N + next] = 0.8;
      m[next * N + i] = -0.5;
    }
  },
  symmetric(m) { // A→B と B→A を平均してそろえる
    const N = numTypes;
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      m[i * N + j] = (matrix[i * N + j] + matrix[j * N + i]) / 2;
    }
  },
  invert(m) { for (let k = 0; k < m.length; k++) m[k] = -matrix[k]; },
  zero(m) { m.fill(0); },
};
$('presets').addEventListener('click', (e) => {
  const name = e.target.dataset && e.target.dataset.preset;
  if (!name) return;
  if (name === 'random') { startCreation(); return; }
  if (name === 'ranges') { resetPairRanges(); refreshMatrixView(); return; }
  const target = new Float32Array(numTypes * numTypes);
  PRESETS[name](target);
  lerpMatrixTo(target);
});

/** 色の種類数を変える。今までの色どうしの関係は残し、増えた分はランダム。粒子の色は振り直す */
function setNumTypes(n) {
  n = Math.max(1, Math.min(MAX_TYPES, n | 0));
  if (n === numTypes) return;
  const old = numTypes, oldM = matrix, oldMax = pairMax, oldMin = pairMin;
  numTypes = n;
  matrix = new Float32Array(n * n);
  matrixFrom = new Float32Array(n * n);
  matrixTo = new Float32Array(n * n);
  pairMax = new Float64Array(n * n).fill(1);
  pairMin = new Float64Array(n * n).fill(params.beta);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    matrix[i * n + j] = i < old && j < old ? oldM[i * old + j] : Math.random() * 2 - 1;
    if (i < old && j < old) { pairMax[i * n + j] = oldMax[i * old + j]; pairMin[i * n + j] = oldMin[i * old + j]; }
  }
  updateRangesUniform();
  matrixLerpT = 1;
  computeTypeColors();
  renderer.applyStyle();
  // 粒子の色を新しい種類数で均等に振り直す (位置・速度はそのまま)
  const onGpu = gpu && gpu.active;
  if (onGpu && !gpu.uploadTypes) gpu.download();   // WebGL 版: 位置を読み戻してから色ごと送り直す
  for (let i = 0; i < params.count; i++) type[i] = (Math.random() * n) | 0;
  renderer.onCountChanged(params.count, 0);
  if (onGpu) { if (gpu.uploadTypes) gpu.uploadTypes(0, params.count); else gpu.uploadRange(0, params.count); }
  simVersion++; idleFrames = 0;
  buildMatrixGrid(); refreshMatrixView(); refreshLabels();
}
ui.types.addEventListener('input', () => setNumTypes(+ui.types.value));

const advInputs = {};
(function buildAdvanced() {

/* =====================================================================
 *  メインループ + FPS 計測 + 自動負荷調整
 * ===================================================================== */
let lastTime = performance.now();
let accumulator = 0;
let elapsed = 0;
let fpsFrames = 0, fpsTime = 0, lowFpsTime = 0;
let simMsSum = 0, simSteps = 0;   // 計算時間の計測 (どこが重いかの切り分け用)
let stallFrames = 0;              // Worker 待ちでシミュレーションを進めなかったフレーム数
let speedHighTime = 0;            // FPS に余裕がある状態が続いた時間 (下げた速度を戻す判定)
let autoCreateTime = 0;           // 自動「創造」までの経過時間
let idleTime = 0;                 // 最後の操作からの時間
let saveTime = 0;                 // 設定の自動保存の間隔
function noteActivity() {
  idleTime = 0;
  document.body.classList.remove('idle');
}
for (const ev of ['pointermove', 'pointerdown', 'keydown', 'wheel']) window.addEventListener(ev, noteActivity, { passive: true });

/** CPU の力計算 (Worker 待ちを含む) が重い状態が続いたら GPU 計算に切り替える */
let heavySteps = 0;
function cpuHeavy(costMs) {
  if (!gpu || gpu.active) return;
  heavySteps = costMs > GPU_ON_MS ? heavySteps + 1 : 0;
  if (heavySteps >= GPU_ON_STEPS && gpu.fits()) {
    gpu.enter();
    heavySteps = 0; lowFpsTime = 0;   // 切り替え前の低 FPS で粒子数を減らさない
    refreshEngineLabel();
  }
}
/** CPU 版の1ステップで調べるペア数の見積もり */
function cpuPairEstimate() {
  const n = params.count;
  return n * n * 9 * params.rMax * params.rMax / (2 * worldW * worldH);
}
/** 粒子数・rMax・画面サイズから、CPU と GPU のどちらで計算するかを決める */
function updateEngine() {
  if (!gpu || gpu.busy) return;
  const est = cpuPairEstimate();
  if (!gpu.active) {
    if (est > GPU_ON_PAIRS && gpu.fits()) { gpu.enter(); heavySteps = 0; lowFpsTime = 0; refreshEngineLabel(); }
  } else if (est < GPU_OFF_PAIRS && params.count <= gpu.enterCount * GPU_OFF_RATIO) {
    gpu.exit(); refreshEngineLabel();
  }
}
function refreshEngineLabel() {
  $('renderer').textContent = renderer.name + (gpu && gpu.active ? ' · GPU計算' : '');
}

// タブの表示が切り替わった直後のフレームは、空白の時間を含むので FPS の計測から外す
let skipFpsFrame = false;
document.addEventListener('visibilitychange', () => { skipFpsFrame = true; });

// GPU がリセットされた (ドライバの再起動や過負荷) ときは、復帰したらページを読み込み直す
let contextLost = false;
canvas.addEventListener('webglcontextlost', (e) => {
  e.preventDefault(); contextLost = true;
  showNotice('GPU がリセットされました。復帰したら読み込み直します');
});
canvas.addEventListener('webglcontextrestored', () => location.reload());

function frame(now) {
  if (contextLost) { requestAnimationFrame(frame); return; }
  const dtRaw = (now - lastTime) / 1000;   // 実際の経過時間 (FPS の計測用)
  let dtReal = dtRaw;
  lastTime = now;
  if (dtReal > 0.25) dtReal = 0.25; // タブ復帰時などの巨大な dt を無視
  elapsed += dtReal;
  if (gpu && !skipFpsFrame) gpu.noteFrameMs(dtRaw * 1000);

  // 「創造」の行列補間 (一時停止中も進める)
  if (updateMatrixLerp(dtReal)) refreshMatrixView();

  updateEngine();

  // 固定 dt で「コマ」を進める: 1 コマ = 計算 1 ステップ (×速度) + 描画 1 回。
  // 1フレームに最大1コマ。遅れを取り戻そうと複数ステップ回すと、
  // 一度の処理落ちで「毎フレーム2ステップ → 30fps に固定」という悪循環になるため。
  // 60Hz では毎フレーム、120Hz では2フレームに1回、144Hz・75Hz でも平均 60 コマ/秒 (余りを繰り越す)。
  // コマが進まないフレームは描かない (前の絵がそのまま表示される) ので、
  // 動きの速さも残像 (描くたびに暗くする量) も画面の書き換え回数によらず同じ。処理落ち時は動きが遅くなるだけ。
  // 停止中も同じ間隔で描く (止めた直後に残像が消えていく速さを揃える)
  accumulator += dtReal;
  let tick = false;
  if (accumulator >= DT * 0.75) {
    if (!params.paused && ((gpu && gpu.busy) || par.inFlight(params.count))) {
      // GPU からの読み戻し中 / Worker の計算がまだ届いていない。このフレームは進めずに待つ
      stallFrames++;
      if (!(gpu && gpu.busy)) cpuHeavy(par.pendingMs);
    } else {
      tick = true;
      accumulator = Math.min(Math.max(accumulator - DT, -DT * 0.25), DT * 0.5);
      if (!params.paused) {
        // シミュレーション速度: 1 フレームに speedNow ステップ (各ステップは ×1 と同じ計算)
        for (let s = 0; s < speedNow; s++) {
          if (s > 0 && ((gpu && gpu.busy) || par.inFlight(params.count))) break;
          const t0 = performance.now();
          const usedWorkers = step(DT * params.timeScale);
          const ms = performance.now() - t0;
          if (!usedWorkers) par.observe(ms);
          if (!(gpu && gpu.active)) cpuHeavy(usedWorkers ? Math.max(ms, par.lastLatencyMs) : ms);
          simMsSum += ms; simSteps++;
        }
        idleFrames = 0;
      }
    }
  }
  // 自動で「創造」
  if (!params.paused && params.autoCreate > 0) {
    autoCreateTime += dtReal;
    if (autoCreateTime >= params.autoCreate) { autoCreateTime = 0; startCreation(); }
  }

  // 停止中は同じ点を同じ場所に描き続けるだけ。各画素の値は 0..255 の整数で、
  // 「暗くする→点を足す」は値について単調なので、高々 255 回で値が変わらなくなる。
  // それ以降は描いても1画素も変わらないので描画を省く (画面は保持されている)
  if (tick && idleFrames < IDLE_DRAW_FRAMES) {
    renderer.draw(params.count);
    idleFrames++;
  }

  // FPS を 0.5 秒ごとに更新 (実際の経過時間で。極端に重くても数秒で自動削減が効くように)
  if (skipFpsFrame) skipFpsFrame = false;
  else { fpsFrames++; fpsTime += dtRaw; }
  // 操作がないとき: パネルとカーソルを隠す / 設定を数秒ごとに自動保存
  idleTime += dtRaw;
  if (params.idleHide > 0 && idleTime >= params.idleHide) document.body.classList.add('idle');
  saveTime += dtRaw;
  if (saveTime >= 3) { saveTime = 0; saveSettings(); }
  if (fpsTime >= 0.5) {
    const fps = fpsFrames / fpsTime;
    // 自動削減の判定は「シミュレーションが実際に進んだ」フレームで行う
    const effectiveFps = (fpsFrames - stallFrames) / fpsTime;
    stallFrames = 0;
    // 「計算」= シミュレーション1ステップの平均時間。60fps には 16ms 未満が必要。
    // 計算が軽いのに FPS が低い場合は、描画 (GPU) か画面側の制限が原因
    // (GPU 計算中は命令を出す時間しか測れないので表示しない)
    ui.fps.textContent = 'FPS ' + fps.toFixed(0) +
      (simSteps && !(gpu && gpu.active) ? ' / 計算 ' + (simMsSum / simSteps).toFixed(1) + 'ms' : '') +
      (gpu && gpu.active && gpu.gpuMs ? ' / GPU ' + gpu.gpuMs.toFixed(1) + 'ms' : '');
    simMsSum = 0; simSteps = 0;
    // 低 FPS が続いたら粒子数を減らす
    if (elapsed > FPS_WARMUP && !document.hidden && effectiveFps < FPS_LOW_THRESHOLD) {
      lowFpsTime += fpsTime;
      if (lowFpsTime >= FPS_LOW_DURATION && speedNow > 1) {
        // まず速度 (1 フレームのステップ数) を下げる。粒子数はそのまま
        const before = speedNow;
        speedNow = Math.max(1, Math.floor(speedNow * 0.7));
        refreshLabels();
        showNotice(`負荷軽減: 速度を ×${before} → ×${speedNow} に下げました`);
        lowFpsTime = 0;
      } else if (lowFpsTime >= FPS_LOW_DURATION && params.count > MIN_COUNT) {
        const before = params.count;
        // 極端に重いときは大きく減らす (100万個 → 数万個 まで何十秒も待たせない)
        const factor = Math.max(0.5, Math.min(AUTO_REDUCE_FACTOR, effectiveFps / 60));
        setCountAndDensity(Math.round(before * factor / 100) * 100);
        refreshLabels();
        showNotice(`負荷軽減: 粒子数を ${before} → ${params.count} に自動で減らしました`);
        lowFpsTime = 0;
      }
    } else {
      lowFpsTime = 0;
      // 余裕が続いたら、下げた速度を1段ずつ戻す
      if (speedNow < params.speed && effectiveFps >= 55) {
        speedHighTime += fpsTime;
        if (speedHighTime >= 3) { speedNow++; speedHighTime = 0; refreshLabels(); }
      } else speedHighTime = 0;
    }
    fpsFrames = 0; fpsTime = 0;
  }

  requestAnimationFrame(frame);
}

/* =====================================================================
 *  設定の保存・読み込み (このブラウザの localStorage に自動保存。ファイルへの書き出し・読み込みも可)
 * ===================================================================== */
function collectSettings() {
  return {
    // density: 100万 CSS px² あたりの粒子数。読み込んだ端末の画面の広さに合わせて個数を決める (v1 は個数 count)
    app: 'shibalab-particle-life', v: 2,
    density: Math.round(params.density * 1e9) / 1e3, rMax: params.rMaxSetting, halfLife: params.halfLife, types: numTypes, speed: params.speed,
    matrix: Array.from(matrix), pairMax: Array.from(pairMax), pairMin: Array.from(pairMin),
    adv: Object.fromEntries(ADVANCED.map(([k]) => [k, params[k]])),
  };
}
let lastSaved = '';
function saveSettings() {
  const s = JSON.stringify(collectSettings());
  if (s === lastSaved) return;
  try { localStorage.setItem(SETTINGS_KEY, s); lastSaved = s; } catch (e) { /* 保存できない環境 (プライベートモード等) */ }
}
/** 設定を当てはめる (値はすべて範囲内に丸める)。粒子の位置はそのまま。
 *  legacyArea: 個数 (count) だけの古い形式を密度に直すときの画面の広さ (ファイルは基準の広さ、この端末の自動保存は今の広さ) */
function applySettings(s, legacyArea = REF_AREA) {
  if (!s || typeof s !== 'object') return false;
  const num = (v, lo, hi, d) => (typeof v === 'number' && isFinite(v)) ? Math.max(lo, Math.min(hi, v)) : d;
  if (s.types !== undefined) setNumTypes(num(s.types, 1, MAX_TYPES, numTypes) | 0);
  const nn = numTypes * numTypes;
  if (s.adv && typeof s.adv === 'object') {
    for (const [key, , lo, hi] of ADVANCED) if (key in s.adv) setAdvanced(key, num(s.adv[key], lo, hi, params[key]));
  }
  if (Array.isArray(s.matrix) && s.matrix.length === nn) {
    for (let k = 0; k < nn; k++) matrix[k] = num(s.matrix[k], -1, 1, matrix[k]);
    matrixLerpT = 1;
  }
  if (Array.isArray(s.pairMax) && s.pairMax.length === nn) for (let k = 0; k < nn; k++) pairMax[k] = num(s.pairMax[k], 0.1, 1, 1);
  if (Array.isArray(s.pairMin) && s.pairMin.length === nn) for (let k = 0; k < nn; k++) pairMin[k] = num(s.pairMin[k], 0.05, 0.9, params.beta);
  updateRangesUniform();
  if (s.rMax !== undefined) { params.rMaxSetting = num(s.rMax, MIN_RMAX, MAX_RMAX, params.rMaxSetting); rebuildGrid(); }
  if (s.halfLife !== undefined) params.halfLife = num(s.halfLife, MIN_HALF_LIFE, MAX_HALF_LIFE, params.halfLife);
  if (s.speed !== undefined) setSpeed(num(s.speed, 1, MAX_SPEED, 1));
  if (typeof s.density === 'number' && isFinite(s.density) && s.density > 0) {
    params.density = Math.min(s.density, 1e6) / 1e6;     // 100万 px² あたり → 1 px² あたり
    fitCountToScreen();
  } else if (s.count !== undefined) {
    params.density = num(s.count, MIN_COUNT, MAX_COUNT, params.count) / legacyArea;
    fitCountToScreen();
  }
  simVersion++; idleFrames = 0;
  refreshLabels(); refreshMatrixView(); refreshAdvanced(); updateEngine(); refreshEngineLabel();
  return true;
}
$('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(collectSettings(), null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'particle-life-settings.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('btnImport').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try { showNotice(applySettings(JSON.parse(await file.text())) ? '設定を読み込みました' : '設定ファイルの形式が違います'); }
  catch (err) { showNotice('設定ファイルを読み込めませんでした'); }
});
$('btnResetAll').addEventListener('click', () => {
  try { localStorage.removeItem(SETTINGS_KEY); } catch (e) { /* 無視 */ }
  lastSaved = '';
  setNumTypes(DEFAULT_TYPES);
  for (const [key, , , , , , def] of ADVANCED) setAdvanced(key, def);
  resetPairRanges();
  params.rMaxSetting = DEFAULT_RMAX; rebuildGrid();
  params.halfLife = DEFAULT_HALF_LIFE;
  setSpeed(1);
  params.density = DEFAULT_DENSITY; fitCountToScreen();
  startCreation();
  refreshLabels(); refreshMatrixView(); refreshAdvanced(); updateEngine(); refreshEngineLabel();
  showNotice('すべて初期値に戻しました');
});
window.addEventListener('pagehide', saveSettings);

/* =====================================================================
 *  起動
 * ===================================================================== */
async function boot() {
  await chooseBackend();
  worldW = Math.max(1, window.innerWidth);
  worldH = Math.max(1, window.innerHeight);
  // 粒子数 = 密度 × 画面の広さ。使う分だけ生成 (増やしたときは setParticleCount が増えた分を生成する)
  params.count = countForScreen();
  for (let i = 0; i < params.count; i++) randomizeParticle(i);
  randomMatrixInto(matrix);
  simVersion++; idleFrames = 0;
  renderer.onCountChanged(params.count, 0);   // 最初の粒子のタイプを描画側へ (以後は増えた分だけ送る)
  resize();
  // 前回の設定を戻す (?reset を付けると戻さない)。個数だけの古い自動保存は、この端末の今の広さで密度に直す
  if (!/[?&]reset/.test(location.search)) {
    try { const saved = localStorage.getItem(SETTINGS_KEY); if (saved) applySettings(JSON.parse(saved), worldW * worldH); }
    catch (e) { console.warn('保存された設定を読めません:', e); }
  }
  refreshLabels();
  refreshMatrixView();
  refreshEngineLabel();
  updateRing();
  requestAnimationFrame(frame);
}
window.appReady = boot();

/* ---- ユーティリティ ---- */
function hslToRgb(h, s, l) {
  const f = (n) => {
    const k = (n + h * 12) % 12;
    return l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1));
  };
  return [f(0), f(8), f(4)];
}
