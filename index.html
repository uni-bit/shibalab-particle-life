<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>破壊と創造 — Particle Life</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000; color: #ddd;
    font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

  /* --- 小さく控えめな操作パネル --- */
  #panel {
    position: fixed; top: 12px; left: 12px; width: 236px; padding: 10px 12px;
    background: rgba(10, 10, 14, 0.62); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; font-size: 12px; line-height: 1.4; user-select: none;
    backdrop-filter: blur(4px);
    max-height: calc(100vh - 24px); overflow-y: auto; box-sizing: border-box;
  }
  body.panel-hidden #panel { display: none; }
  #panel .titlebar { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
  #panel h1 { font-size: 13px; font-weight: 600; margin: 0 0 6px; letter-spacing: 0.08em; }
  #panel #panelClose {
    flex: 0 0 auto; width: 22px; height: 22px; padding: 0; line-height: 20px; font-size: 15px;
    margin: -2px -4px 0 0; background: transparent; border-color: transparent; opacity: 0.6;
  }
  #panel #panelClose:hover { opacity: 1; background: rgba(255,255,255,0.12); }
  /* パネルを隠しているときだけ出る小さな再表示ボタン */
  #panelOpen {
    position: fixed; top: 12px; left: 12px; width: 30px; height: 30px; padding: 0;
    border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); background: rgba(10,10,14,0.5);
    color: #ddd; font-size: 16px; line-height: 28px; cursor: pointer; opacity: 0.7;
    display: none; transition: opacity 0.2s;
  }
  #panelOpen:hover { opacity: 1; }
  body.panel-hidden #panelOpen { display: block; }
  #panel .row { margin: 6px 0; }
  #panel label { display: flex; justify-content: space-between; opacity: 0.85; }
  #panel input[type=range] { width: 100%; margin: 2px 0 0; accent-color: #9ad; }
  #panel .buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  #panel button {
    flex: 1 1 auto; background: rgba(255,255,255,0.07); color: #eee; font: inherit;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 5px; padding: 4px 6px; cursor: pointer;
  }
  #panel button:hover { background: rgba(255,255,255,0.15); }
  #panel .buttons.small button { flex: 1 1 30%; font-size: 11px; padding: 3px 4px; }
  #panel .section { margin-top: 10px; display: flex; justify-content: space-between; align-items: baseline; }
  #panel .section b { font-weight: 600; opacity: 0.9; }
  #panel .hint { opacity: 0.5; font-size: 10.5px; }
  #panel details { margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 6px; }
  #panel summary { cursor: pointer; opacity: 0.9; font-weight: 600; }
  #stats { display: flex; justify-content: space-between; opacity: 0.75; margin-top: 8px; }
  #notice { color: #fc8; min-height: 1.4em; margin-top: 4px; font-size: 11px; }
  #help { opacity: 0.5; font-size: 11px; margin-top: 6px; }

  /* 6×6 引力行列の可視化 (行=作用を受ける側, 列=相手) */
  #matrix { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 4px; }
  #matrix div { aspect-ratio: 1 / 1; border-radius: 2px; }
  #matrix .head { transform: scale(0.55); border-radius: 50%; }
  /* 係数のセル: 上下ドラッグ (またはホイール) で調整、ダブルクリックで 0 */
  #matrix .cell {
    cursor: ns-resize; touch-action: none; position: relative;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: rgba(255,255,255,0.85); font-variant-numeric: tabular-nums;
  }
  #matrix .cell:hover, #matrix .cell.active { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.7); }
  #matrix.editing .cell:not(.active) { opacity: 0.55; }
  #matrixInfo { min-height: 1.5em; margin-top: 5px; font-size: 11px; display: flex; align-items: center; gap: 4px; }
  #matrixInfo .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
  #matrixInfo .val { font-variant-numeric: tabular-nums; font-weight: 600; margin-left: auto; }
  /* 行列の編集対象: 力 / 最大距離 / 最小距離 */
  #matrixMode { display: flex; gap: 3px; margin-top: 5px; }
  #panel #matrixMode button { flex: 1 1 0; font-size: 11px; padding: 2px 4px; opacity: 0.55; }
  #panel #matrixMode button.on { opacity: 1; background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.35); }
  #importFile { display: none; }
  /* 操作がしばらくないとき (詳細設定で指定): パネルとカーソルを隠す */
  body.idle #panel, body.idle #panelOpen { display: none !important; }
  body.idle #view { cursor: none; }

  /* 「破壊」中のポインタ位置を示すリング */
  #ring {
    position: fixed; pointer-events: none; border: 1px solid rgba(255,140,120,0.45);
    border-radius: 50%; display: none; transform: translate(-50%, -50%);
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ring"></div>

<button id="panelOpen" title="パネルを表示 (H)" aria-label="パネルを表示">⚙</button>
<div id="panel">
  <div class="titlebar">
    <h1>破壊と創造 <span style="opacity:.5;font-weight:400">Particle Life</span></h1>
    <button id="panelClose" title="パネルを隠す (H)" aria-label="パネルを隠す">×</button>
  </div>
  <div class="row">
    <label><span>粒子数</span><span id="countVal"></span></label>
    <input id="count" type="range" title="画面の広さあたりの数として覚え、画面の大きさが変わると同じ混み具合になるよう増減します">
  </div>
  <div class="row">
    <label><span>相互作用半径 rMax</span><span id="rmaxVal"></span></label>
    <input id="rmax" type="range">
  </div>
  <div class="row">
    <label><span>摩擦 (速度の半減期)</span><span id="frictionVal"></span></label>
    <input id="friction" type="range">
  </div>
  <div class="row">
    <label><span>色の数</span><span id="typesVal"></span></label>
    <input id="types" type="range">
  </div>
  <div class="row">
    <label><span>シミュレーション速度</span><span id="speedVal"></span></label>
    <input id="speed" type="range" title="1 フレームに進めるステップ数 (1〜8 キー)">
  </div>
  <div class="buttons">
    <button id="btnCreate" title="R キー">創造 (R)</button>
    <button id="btnPause" title="Space キー">一時停止</button>
    <button id="btnScatter" title="位置だけをばらまき直す (関係はそのまま)。S キー">散らす (S)</button>
    <button id="btnFull" title="F キー">全画面 (F)</button>
  </div>
  <div class="section"><b>色どうしの関係</b><span class="hint">セルを上下にドラッグ</span></div>
  <div id="matrixMode">
    <button data-mode="force" class="on" title="引き寄せる (+) / 離れる (-) 強さ">力</button>
    <button data-mode="max" title="その色の組が影響し合う最大の距離 (rMax に対する割合)">最大距離</button>
    <button data-mode="min" title="近すぎて反発し合う距離 (その組の最大距離に対する割合)">最小距離</button>
  </div>
  <div id="matrix"></div>
  <div id="matrixInfo"></div>
  <div class="buttons small" id="presets">
    <button data-preset="random" title="ランダムな関係 (R キーと同じ)">ランダム</button>
    <button data-preset="self" title="同じ色どうしで集まり、違う色を避ける">同色集合</button>
    <button data-preset="chase" title="各色が次の色を追いかけ、追われる側は逃げる">追いかけ</button>
    <button data-preset="symmetric" title="A→B と B→A を同じにする (落ち着いた動きになる)">対称</button>
    <button data-preset="invert" title="引き合う ⇔ 反発する を入れ替える">反転</button>
    <button data-preset="zero" title="すべての関係を 0 にする">ゼロ</button>
    <button data-preset="ranges" title="色の組ごとの最大・最小距離をすべて初期値に戻す">範囲を揃える</button>
  </div>
  <details id="advanced">
    <summary>詳細設定</summary>
    <div id="advRows"></div>
    <div class="buttons"><button id="btnResetAdv">詳細設定を初期値に戻す</button></div>
    <div class="buttons small">
      <button id="btnExport" title="今の設定 (関係・範囲・詳細設定など) をファイルに保存">設定を書き出す</button>
      <button id="btnImport" title="書き出した設定ファイルを読み込む">設定を読み込む</button>
      <button id="btnResetAll" title="保存された設定を消して、すべて初期値に戻す">すべて初期値に</button>
    </div>
    <div class="hint">設定はこのブラウザに自動で保存され、次に開いたときに戻ります</div>
    <input id="importFile" type="file" accept="application/json,.json">
  </details>
  <div id="stats"><span id="fps">FPS --</span><span id="renderer"></span></div>
  <div id="notice"></div>
  <div id="help">押し続けて「破壊」/ R 創造 / S 散らす / 1〜8 速度 / Space 停止 / F 全画面 / H パネルを隠す・出す</div>
</div>

<script>
'use strict';

/* =====================================================================
 *  定数 (Constants) — 調整したい値はすべてここに集約
 * ===================================================================== */
const DEFAULT_TYPES      = 6;       // 粒子の色の種類数 (初期値)
const MAX_TYPES          = 10;      // 色の種類数の上限 (シェーダの配列サイズ)
// 粒子数は「画面の広さあたりの数 (密度)」で持ち、開いた画面の広さから個数を決める。
// 世界の大きさ = 画面の大きさなので、個数のままだと小さい画面 (スマホ) ほど混み合って動きが変わるため
const REF_AREA           = 1920 * 1080;          // 基準の画面の広さ [CSS px²] (個数だけの古い設定ファイルの換算用)
const DEFAULT_DENSITY    = 14429.717 / 1e6;      // 初期の密度 [個 / CSS px²] (100万 px² あたり 14429.717 個 = 1920×1080 で約 29,900 個)
const MIN_COUNT         = 500;     // スライダー最小
const MAX_COUNT          = 1000000; // スライダー最大 (= 配列確保サイズ)。GPU 計算が使えるとき
const MAX_COUNT_CPU      = 30000;   // GPU 計算が使えないときのスライダー最大

const DEFAULT_RMAX       = 50;      // 相互作用半径 [CSS px]
const MIN_RMAX           = 30;
const MAX_RMAX           = 160;
const BETA               = 0.52;    // この正規化距離未満は常に反発
const FORCE_FACTOR       = 8;       // 力の強さ (加速度 = f * rMax * FORCE_FACTOR)

const DEFAULT_HALF_LIFE  = 0.02;    // 速度が半分になるまでの時間 [s]
const MIN_HALF_LIFE      = 0.01;
const MAX_HALF_LIFE      = 0.20;
const DT                 = 1 / 60;  // 固定シミュレーション時間刻み [s]
const MAX_SPEED          = 8;       // シミュレーション速度 (1 フレームに進めるステップ数) の上限
const SETTINGS_KEY       = 'shibalab-particle-life:settings';   // 設定の自動保存先 (localStorage)

const MATRIX_LERP_TIME   = 1.5;     // 「創造」時に行列を補間する時間 [s]

const POINTER_RADIUS     = 115;     // 「破壊」の影響半径 [CSS px]
const POINTER_FORCE      = 5000;    // 「破壊」の押し出し加速度 [px/s^2]

const MAX_DPR            = 1.5;     // devicePixelRatio の上限 (性能のため)
const POINT_SIZE         = 6;       // 描画する点の大きさ [CSS px] (グロー込み)
const POINT_ALPHA        = 1;       // 加算合成時の明るさ
// 描画は 1/60 秒に 1 回 (画面の書き換えが 120Hz などでも同じ。メインループ参照)
const TRAIL_FADE         = 0.84;    // 残像: 描くたびに画面を暗くする割合 (1 = 残像なし)
const TRAIL_FLOOR        = 2 / 255; // 残像が8bit丸めで残り続けないよう描くたびに引く値

const FPS_LOW_THRESHOLD  = 40;      // この FPS を下回り続けたら粒子数を自動削減
const FPS_LOW_DURATION   = 2.0;     // 何秒続いたら削減するか
const AUTO_REDUCE_FACTOR = 0.8;     // 削減時に掛ける係数
const FPS_WARMUP         = 2.0;     // 起動直後は計測しない [s]

const MAX_WORKERS        = 16;      // 力の計算を並列化する Worker の最大数
const WORKER_TIMEOUT_MS  = 3000;    // これ以上 Worker の結果が来なければ壊れたとみなしメインスレッドで計算
// CPU 版の1ステップで調べるペア数の見積もり (粒子数² × 3×3セルの面積 / 画面面積 / 2) がこれを超えたら
// 試さずに GPU 計算へ (超巨大な粒子数を CPU で1ステップでも回すと数十秒固まるため)
const GPU_ON_PAIRS       = 6e6;
const GPU_OFF_PAIRS      = 2e6;     // GPU から CPU に戻すのは見積もりがこれ未満のときだけ
const GPU_ON_MS          = 12;      // CPU の力計算 (Worker 待ち含む) がこれを超え続けたら GPU 計算へ [ms]
const GPU_ON_STEPS       = 5;       // 何ステップ続いたら切り替えるか
const GPU_OFF_RATIO      = 0.6;     // GPU に切り替えた時の粒子数 × この値 以下になったら CPU に戻す
const PAR_ON_MS          = 8;       // 力の計算がこれより重くなったら並列化を始める [ms]
const PAR_OFF_MS         = 4;       // Worker 合計時間がこれより軽くなったら並列化をやめる [ms]
const IDLE_DRAW_FRAMES   = 256;     // 停止中、変化がないまま この回数描いたら描画を止める (後述)

// 各タイプの色 (RGB 0..1)。色相を等間隔に配置
let numTypes = DEFAULT_TYPES;      // 今の色の種類数 (UI で変えられる)
const TYPE_COLORS = new Float32Array(MAX_TYPES * 3);
function computeTypeColors() {
  for (let t = 0; t < numTypes; t++) {
    const [r, g, b] = hslToRgb(t / numTypes, 0.9, 0.6);
    TYPE_COLORS[t * 3] = r; TYPE_COLORS[t * 3 + 1] = g; TYPE_COLORS[t * 3 + 2] = b;
  }
}
computeTypeColors();

/* =====================================================================
 *  シミュレーション状態 (すべて起動時に確保した型付き配列 — 毎フレームの確保なし)
 * ===================================================================== */
const posX = new Float32Array(MAX_COUNT);
const posY = new Float32Array(MAX_COUNT);
const velX = new Float32Array(MAX_COUNT);
const velY = new Float32Array(MAX_COUNT);
const type = new Uint8Array(MAX_COUNT);
const cellOf = new Int32Array(MAX_COUNT);     // 各粒子が属するグリッドセル
const sortedIdx = new Int32Array(MAX_COUNT);  // セル順に並べた粒子インデックス
// セル順に詰め直した位置・タイプのコピー。近傍探索でメモリを連続して読めるので速い
const sortX = new Float32Array(MAX_COUNT);
const sortY = new Float32Array(MAX_COUNT);
const sortT = new Uint8Array(MAX_COUNT);
const forceX = new Float32Array(MAX_COUNT);   // 力の合計 (セル順)
const forceY = new Float32Array(MAX_COUNT);
// 各ペアを1回だけ調べるための「前方」の隣接セル (添字 0 は同じセル)
const NEIGHBOR_DX = [0, 1, -1, 0, 1];
const NEIGHBOR_DY = [0, 0,  1, 1, 1];

// 引力行列: matrix[i*numTypes + j] = タイプ i がタイプ j から受ける引力 (-1..1)
// 色の種類数を変えると作り直す (長さは常に numTypes²)
let matrix     = new Float32Array(DEFAULT_TYPES * DEFAULT_TYPES); // 現在使用中の値
let matrixFrom = new Float32Array(DEFAULT_TYPES * DEFAULT_TYPES); // 補間の始点
let matrixTo   = new Float32Array(DEFAULT_TYPES * DEFAULT_TYPES); // 補間の終点
let matrixLerpT = 1;  // 0..1 (1 = 補間完了)

// 色の組ごとの影響範囲 (添字は matrix と同じ: i*numTypes + j = タイプ i が j から受ける力)
//   pairMax = 最大距離 (rMax に対する割合 0.1..1)。グリッドは rMax で作るので rMax を超えない
//   pairMin = 近すぎて反発する距離 (その組の最大距離に対する割合。全体の初期値は params.beta)
// すべて初期値 (pairMax = 1, pairMin = params.beta) のときは元と同じ計算 (CPU 版はビット単位で同一)
let pairMax = new Float64Array(DEFAULT_TYPES * DEFAULT_TYPES).fill(1);
let pairMin = new Float64Array(DEFAULT_TYPES * DEFAULT_TYPES).fill(BETA);
let rangesAreUniform = true;
function updateRangesUniform() {
  rangesAreUniform = true;
  for (let k = 0; k < pairMax.length; k++) {
    if (pairMax[k] !== 1 || pairMin[k] !== params.beta) { rangesAreUniform = false; break; }
  }
}
/** 組ごとの影響範囲を1つ書き換える */
function setPairRange(arr, k, v, lo, hi) {
  arr[k] = Math.max(lo, Math.min(hi, v));
  updateRangesUniform();
  simVersion++;
}
/** すべての組を初期値に (全体の反発距離 params.beta) */
function resetPairRanges() {
  pairMax.fill(1); pairMin.fill(params.beta);
  updateRangesUniform();
  simVersion++;
}
// CPU 版で使う組ごとの表 (R = rMax × pairMax, β = pairMin)
const pairT = {
  R2: new Float64Array(MAX_TYPES * MAX_TYPES), IR: new Float64Array(MAX_TYPES * MAX_TYPES),
  B: new Float64Array(MAX_TYPES * MAX_TYPES), IB: new Float64Array(MAX_TYPES * MAX_TYPES), IOMB: new Float64Array(MAX_TYPES * MAX_TYPES),
};
function pairTables() {
  for (let k = 0; k < numTypes * numTypes; k++) {
    const R = params.rMax * pairMax[k], b = pairMin[k];
    pairT.R2[k] = R * R; pairT.IR[k] = 1 / R; pairT.B[k] = b; pairT.IB[k] = 1 / b; pairT.IOMB[k] = 1 / (1 - b);
  }
  return pairT;
}

const params = {
  count: MIN_COUNT,          // 今の粒子数 (起動時に 密度 × 画面の広さ で決め直す)
  density: DEFAULT_DENSITY,  // 画面の広さあたりの粒子数 [個 / CSS px²]。設定として保存するのはこちら
  rMaxSetting: DEFAULT_RMAX, // スライダーで指定した値
  rMax: DEFAULT_RMAX,        // 実際に使う値 (極端に小さいウィンドウでは制限される)
  halfLife: DEFAULT_HALF_LIFE,
  paused: false,
  speed: 1,                  // シミュレーション速度: 1 フレームに進めるステップ数 (見た目の動きは ×1 と同じ式)
  // 「詳細設定」で変えられる値 (初期値は上の定数)
  timeScale: 1,                      // 時間の速さ (1 ステップで進める時間 = DT × これ)
  forceFactor: FORCE_FACTOR,
  beta: BETA,
  pointSize: POINT_SIZE,
  pointAlpha: POINT_ALPHA,
  trailFade: TRAIL_FADE,
  pointerRadius: POINTER_RADIUS,
  pointerForce: POINTER_FORCE,
  lerpTime: MATRIX_LERP_TIME,
  autoCreate: 0,             // この秒数ごとに自動で「創造」(0 = しない)
  idleHide: 0,               // 操作がこの秒数ないとパネルとカーソルを隠す (0 = しない)
};

// 世界 (トーラス) のサイズ = ウィンドウの CSS ピクセルサイズ
let worldW = 1, worldH = 1;

// 一様グリッド (セルサイズ >= rMax)。サイズ変更時のみ再確保
let gridCols = 1, gridRows = 1, cellW = 1, cellH = 1;
let cellCount = new Int32Array(1);
let cellStart = new Int32Array(2);

// 力の計算結果に影響する状態 (行列・rMax・グリッド・世界サイズ・粒子数) が変わるたびに増える。
// Worker が先回りして計算した力が「今の状態」のものかどうかの判定に使う
let simVersion = 0;
// 停止中に同じ絵を描き続けているフレーム数 (0 = 直前に何か変わった)
let idleFrames = 0;
// GPU 計算エンジン (WebGPU、なければ WebGL2 のときのみ。chooseBackend で生成)
let gpu = null;

/* ---------------------------------------------------------------------
 *  入力 — 「破壊」の位置。
 *  将来 Web カメラの手検出に置き換える場合は、この3項目を書き換えるだけでよい。
 *  (例: 手のひらの座標を x,y に、手が開いている間 active = true)
 *  座標は CSS ピクセル (世界座標と同じ)。
 * --------------------------------------------------------------------- */
const input = { active: false, x: 0, y: 0 };

/* =====================================================================
 *  初期化ヘルパー
 * ===================================================================== */
function randomizeParticle(i) {
  posX[i] = Math.random() * worldW;
  posY[i] = Math.random() * worldH;
  velX[i] = 0; velY[i] = 0;
  type[i] = (Math.random() * numTypes) | 0;
}

function randomMatrixInto(target) {
  for (let k = 0; k < target.length; k++) target[k] = Math.random() * 2 - 1;
}

/** 「創造」: 新しいランダム行列へ params.lerpTime 秒かけて滑らかに移行する */
function startCreation() {
  matrixFrom.set(matrix);       // 補間途中でも「今の値」から始める
  randomMatrixInto(matrixTo);
  matrixLerpT = 0;
}

/** 行列を target へ滑らかに移行する (プリセット用) */
function lerpMatrixTo(target) {
  matrixFrom.set(matrix);
  matrixTo.set(target);
  matrixLerpT = 0;
}

/** 係数を1つ直接書き換える (補間中なら止めて、手で決めた値を優先) */
function setMatrixValue(k, v) {
  matrixLerpT = 1;
  matrix[k] = Math.max(-1, Math.min(1, v));
  simVersion++;
}

function updateMatrixLerp(dtReal) {
  if (matrixLerpT >= 1) return false;
  matrixLerpT = params.lerpTime > 0 ? Math.min(1, matrixLerpT + dtReal / params.lerpTime) : 1;
  const s = matrixLerpT * matrixLerpT * (3 - 2 * matrixLerpT); // smoothstep
  for (let k = 0; k < matrix.length; k++) {
    matrix[k] = matrixFrom[k] + (matrixTo[k] - matrixFrom[k]) * s;
  }
  simVersion++;
  return true;
}

/** 今の環境で選べる最大粒子数 */
function maxCount() { return gpu ? MAX_COUNT : MAX_COUNT_CPU; }

function setParticleCount(n) {
  n = Math.max(MIN_COUNT, Math.min(maxCount(), n | 0));
  const from = params.count;
  for (let i = from; i < n; i++) randomizeParticle(i); // 増えた分だけ生成
  params.count = n;
  simVersion++; idleFrames = 0;
  renderer.onCountChanged(n, from);
  if (gpu && gpu.active && n > from) gpu.uploadRange(from, n);   // GPU 計算中は増えた分だけ送る
}

/** 今の密度と画面の広さから決まる粒子数 */
function countForScreen() {
  return Math.max(MIN_COUNT, Math.min(maxCount(), Math.round(params.density * worldW * worldH)));
}
/** 密度に合わせて粒子数を決め直す (起動・画面サイズの変更・設定の読み込み) */
function fitCountToScreen() { setParticleCount(countForScreen()); }
/** 粒子数を直接決める (スライダー・自動削減)。その数を今の画面での密度として覚える */
function setCountAndDensity(n) {
  setParticleCount(n);
  params.density = params.count / (worldW * worldH);
}

/** グリッドの寸法を決める。セル幅は rMax 以上なので 3×3 セルの探索で十分 */
function rebuildGrid() {
  // rMax が世界の半分を超えると最短像 (minimum image) が一意でなくなるので制限
  // さらに 1/3 以下にして、グリッドが必ず 3×3 以上になるようにする (step の前提)
  const rMax = Math.min(params.rMaxSetting, worldW / 3, worldH / 3);
  params.rMax = rMax;   // 実際に使う値 (スライダー値 rMaxSetting は保持)
  gridCols = Math.max(1, Math.floor(worldW / rMax));
  gridRows = Math.max(1, Math.floor(worldH / rMax));
  cellW = worldW / gridCols;   // >= rMax
  cellH = worldH / gridRows;   // >= rMax
  const nCells = gridCols * gridRows;
  if (cellCount.length !== nCells) {
    cellCount = new Int32Array(nCells);
    cellStart = new Int32Array(nCells + 1);
  }
  simVersion++;
}

function resize() {
  const oldW = worldW, oldH = worldH;
  worldW = Math.max(1, window.innerWidth);
  worldH = Math.max(1, window.innerHeight);
  // 既存粒子は相対位置を保って新しい世界に拡大縮小
  const sx = worldW / oldW, sy = worldH / oldH;
  if (gpu && gpu.active) gpu.rescale(sx, sy);   // GPU 計算中は GPU 上で拡大縮小
  else for (let i = 0; i < params.count; i++) {
    posX[i] = Math.min(posX[i] * sx, worldW - 1e-3);
    posY[i] = Math.min(posY[i] * sy, worldH - 1e-3);
  }
  rebuildGrid();   // simVersion も進む
  idleFrames = 0;
  renderer.resize(worldW, worldH, Math.min(window.devicePixelRatio || 1, MAX_DPR));
  // 画面の広さが変わったら、同じ密度になるよう粒子数を合わせる (サイズ変更が落ち着いてから)
  if (worldW * worldH !== oldW * oldH) {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(() => { fitCountToScreen(); refreshLabels(); }, 300);
  }
}
let fitTimer = 0;

/* =====================================================================
 *  シミュレーション本体
 * ===================================================================== */

/** 粒子をセルごとに並べる (計数ソート, O(n)) */
function binParticles(n) {
  cellCount.fill(0);
  for (let i = 0; i < n; i++) {
    // 浮動小数の端 (x == worldW) 対策で最大値にクランプ
    let cx = (posX[i] / cellW) | 0; if (cx >= gridCols) cx = gridCols - 1;
    let cy = (posY[i] / cellH) | 0; if (cy >= gridRows) cy = gridRows - 1;
    const c = cy * gridCols + cx;
    cellOf[i] = c;
    cellCount[c]++;
  }
  // 累積和で各セルの開始位置を求める
  let acc = 0;
  for (let c = 0; c < cellCount.length; c++) { cellStart[c] = acc; acc += cellCount[c]; }
  cellStart[cellCount.length] = acc;
  // cellCount を書き込みカーソルとして再利用
  for (let c = 0; c < cellCount.length; c++) cellCount[c] = cellStart[c];
  for (let i = 0; i < n; i++) {
    const k = cellCount[cellOf[i]]++;
    sortedIdx[k] = i;
    sortX[k] = posX[i]; sortY[k] = posY[i]; sortT[k] = type[i];
  }
}

function step(dt) {
  const n = params.count;
  const rMax = params.rMax;
  const rMax2 = rMax * rMax;
  const invRMax = 1 / rMax;
  const halfW = worldW * 0.5, halfH = worldH * 0.5;
  const friction = Math.pow(0.5, dt / params.halfLife); // 半減期型の減衰係数
  const accScale = rMax * params.forceFactor * dt;
  const beta = params.beta, nT = numTypes;
  const INV_BETA = 1 / beta, INV_ONE_MINUS_BETA = 1 / (1 - beta);
  const PR = params.pointerRadius, PF = params.pointerForce;

  // 粒子が多すぎて CPU が追いつかないときは GPU で丸ごと計算 (状態も GPU 上に置いたまま)
  if (gpu && gpu.active) { gpu.step(dt, friction, accScale); return false; }

  // Worker が前のステップの直後に「今の状態」の力を計算済みなら、それを使う
  // (ビン分けも送信時に済んでいる)。結果は下のループとビット単位で同一。
  const usedWorkers = par.takeResult(n);
  if (!usedWorkers) {
  binParticles(n);

  // ---- 1) 力の計算 ----
  // 各ペアを1回だけ調べ、距離計算 (sqrt など) を両方の粒子で共有する。
  // 引力係数は非対称 (A→B と B→A が違う) なので、力そのものは別々に求める。
  // 「同じセル内」と「右・左下・下・右下の4セル」だけ見れば全ペアを1回ずつ網羅できる。
  // (グリッドは必ず 3×3 以上 → rebuildGrid 参照)
  forceX.fill(0, 0, n);
  forceY.fill(0, 0, n);
  if (!rangesAreUniform) {
    // 色の組ごとに影響範囲が違う: 走査順は同じで、組ごとの距離で力を求める
    const T = pairTables();
    bandForcesPP(0, gridRows, gridCols, gridRows, worldW, worldH, rMax2, nT, matrix,
                 T.R2, T.IR, T.B, T.IB, T.IOMB, sortX, sortY, sortT, cellStart, forceX, forceY);
  } else
  for (let cy = 0; cy < gridRows; cy++) {
    for (let cx = 0; cx < gridCols; cx++) {
      const c = cy * gridCols + cx;
      const s0 = cellStart[c], e0 = cellStart[c + 1];
      if (s0 === e0) continue;

      // m = 0: 同じセル内。m = 1..4: 隣の4セル
      for (let m = 0; m < 5; m++) {
        let q0, q1, offX = 0, offY = 0;
        if (m === 0) { q0 = s0; q1 = e0; }
        else {
          let nx = cx + NEIGHBOR_DX[m], ny = cy + NEIGHBOR_DY[m];
          // 端はトーラスとして反対側のセルへ回り込み、その分だけ座標をずらす
          if (nx < 0) { nx += gridCols; offX = -worldW; } else if (nx >= gridCols) { nx -= gridCols; offX = worldW; }
          if (ny >= gridRows) { ny -= gridRows; offY = worldH; }
          const q = ny * gridCols + nx;
          q0 = cellStart[q]; q1 = cellStart[q + 1];
          if (q0 === q1) continue;
        }
        for (let a = s0; a < e0; a++) {
          const xa = sortX[a] - offX, ya = sortY[a] - offY;
          const rowA = sortT[a] * nT, ta = sortT[a];
          let fxa = 0, fya = 0;
          for (let b = (m === 0 ? a + 1 : q0); b < q1; b++) {
            const dx = sortX[b] - xa;
            const dy = sortY[b] - ya;
            const d2 = dx * dx + dy * dy;
            if (d2 >= rMax2 || d2 === 0) continue;
            const d = Math.sqrt(d2);
            const r = d * invRMax;
            const invD = 1 / d;
            if (r < beta) {
              // 近すぎる → タイプに関係なく反発 (対称)
              const sc = (r * INV_BETA - 1) * invD;
              const px = dx * sc, py = dy * sc;
              fxa += px; fya += py;
              forceX[b] -= px; forceY[b] -= py;
            } else {
              // 三角形の引力/斥力。係数だけ a→b と b→a で違う
              const tri = (1 - Math.abs(2 * r - 1 - beta) * INV_ONE_MINUS_BETA) * invD;
              const tb = sortT[b];
              const sa = matrix[rowA + tb] * tri;
              const sb = matrix[tb * nT + ta] * tri;
              fxa += dx * sa; fya += dy * sa;
              forceX[b] -= dx * sb; forceY[b] -= dy * sb;
            }
          }
          forceX[a] += fxa; forceY[a] += fya;
        }
      }
    }
  }
  }

  // ---- 力 → 速度 (k はセル順の番号、i は元の粒子番号) ----
  for (let k = 0; k < n; k++) {
    const i = sortedIdx[k];
    let vx = velX[i] * friction + forceX[k] * accScale;
    let vy = velY[i] * friction + forceY[k] * accScale;

    // 「破壊」: 入力位置から放射状に押し出す (トーラス上の最短距離で判定)
    if (input.active) {
      let dx = sortX[k] - input.x;
      if (dx > halfW) dx -= worldW; else if (dx < -halfW) dx += worldW;
      let dy = sortY[k] - input.y;
      if (dy > halfH) dy -= worldH; else if (dy < -halfH) dy += worldH;
      const d2 = dx * dx + dy * dy;
      if (d2 < PR * PR && d2 > 1e-6) {
        const d = Math.sqrt(d2);
        const sc = (1 - d / PR) * PF * dt / d;
        vx += dx * sc; vy += dy * sc;
      }
    }
    velX[i] = vx; velY[i] = vy;
  }

  // ---- 2) 速度 → 位置 (トーラスで回り込み) ----
  for (let i = 0; i < n; i++) {
    let x = posX[i] + velX[i] * dt;
    let y = posY[i] + velY[i] * dt;
    // 1ステップの移動量は世界サイズより十分小さい前提。念のため while で確実に範囲内へ
    while (x < 0) x += worldW; while (x >= worldW) x -= worldW;
    while (y < 0) y += worldH; while (y >= worldH) y -= worldH;
    posX[i] = x; posY[i] = y;
  }

  // 次のステップの力を Worker に先回りで計算させる (重いときだけ)
  par.dispatch(n);
  return usedWorkers;
}

/* =====================================================================
 *  並列計算: 力の計算を Web Worker に分担させる
 *
 *  グリッドの行を帯 (バンド) に分け、各 Worker は「自分の行」と「その1つ上の行」を
 *  元と全く同じセル順に走査し、自分の行の粒子の力だけを書き込む。
 *  forceX[k] (Float32) への加算が元と同じ順序・同じ演算で行われるので、
 *  結果はメインスレッドで計算した場合とビット単位で一致する (見た目は一切変わらない)。
 *
 *  ステップ N の直後に状態 N の力を送っておき、ステップ N+1 で受け取る。
 *  その間に行列・rMax・粒子数・画面サイズが変わったら (simVersion で判定) 捨てて、
 *  従来どおりメインスレッドで計算する。「創造」の補間中は毎フレーム行列が変わるので送らない。
 * ===================================================================== */

/** 行 [r0, r1) が持つ粒子の力を計算する。Worker 内で実行 (外部変数を参照しないこと) */
function bandForces(r0, r1, cols, rows, W, H, rMax2, invRMax, beta, nTypes, M, sx, sy, st, cs, fx, fy) {
  const INV_BETA = 1 / beta, INV_ONE_MINUS_BETA = 1 / (1 - beta);
  const above = r0 === 0 ? rows - 1 : r0 - 1;   // 下隣として自分の行に作用する行
  for (let cy = 0; cy < rows; cy++) {             // 走査順は元と同じ (行 0 → 最終行)
    const aOwn = cy >= r0 && cy < r1;
    if (!aOwn && cy !== above) continue;
    const ny1 = cy + 1 >= rows ? 0 : cy + 1;
    const offYDown = cy + 1 >= rows ? H : 0;
    const downOwn = ny1 >= r0 && ny1 < r1;
    for (let cx = 0; cx < cols; cx++) {
      const c = cy * cols + cx;
      const s0 = cs[c], e0 = cs[c + 1];
      if (s0 === e0) continue;
      for (let m = 0; m < 5; m++) {   // 0: 同じセル, 1: 右, 2: 左下, 3: 下, 4: 右下 (元と同順)
        let q0, q1, offX = 0, offY = 0, bOwn;
        if (m === 0) { q0 = s0; q1 = e0; bOwn = aOwn; }
        else {
          let nx = (m === 1 || m === 4) ? cx + 1 : (m === 2 ? cx - 1 : cx);
          let ny = cy;
          if (nx < 0) { nx += cols; offX = -W; } else if (nx >= cols) { nx -= cols; offX = W; }
          if (m === 1) bOwn = aOwn;
          else { ny = ny1; offY = offYDown; bOwn = downOwn; }
          const q = ny * cols + nx;
          q0 = cs[q]; q1 = cs[q + 1];
          if (q0 === q1) continue;
        }
        if (!aOwn && !bOwn) continue;
        for (let a = s0; a < e0; a++) {
          const xa = sx[a] - offX, ya = sy[a] - offY;
          const rowA = st[a] * nTypes, ta = st[a];
          let fxa = 0, fya = 0;
          for (let b = (m === 0 ? a + 1 : q0); b < q1; b++) {
            const dx = sx[b] - xa;
            const dy = sy[b] - ya;
            const d2 = dx * dx + dy * dy;
            if (d2 >= rMax2 || d2 === 0) continue;
            const d = Math.sqrt(d2);
            const r = d * invRMax;
            const invD = 1 / d;
            if (r < beta) {
              const sc = (r * INV_BETA - 1) * invD;
              const px = dx * sc, py = dy * sc;
              fxa += px; fya += py;
              if (bOwn) { fx[b] -= px; fy[b] -= py; }
            } else {
              const tri = (1 - Math.abs(2 * r - 1 - beta) * INV_ONE_MINUS_BETA) * invD;
              const tb = st[b];
              const sa = M[rowA + tb] * tri;
              const sb = M[tb * nTypes + ta] * tri;
              fxa += dx * sa; fya += dy * sa;
              if (bOwn) { fx[b] -= dx * sb; fy[b] -= dy * sb; }
            }
          }
          if (aOwn) { fx[a] += fxa; fy[a] += fya; }
        }
      }
    }
  }
}

/** bandForces と同じ走査で、色の組ごとに影響範囲 (最大距離 R・反発距離 β) が違う場合の力。
 *  a が b から受ける力は組 (a, b) の R・β・係数、b が a から受ける力は組 (b, a) のもので別々に求める */
function bandForcesPP(r0, r1, cols, rows, W, H, rMax2, nTypes, M, R2, IR, B, IB, IOMB, sx, sy, st, cs, fx, fy) {
  const above = r0 === 0 ? rows - 1 : r0 - 1;
  for (let cy = 0; cy < rows; cy++) {
    const aOwn = cy >= r0 && cy < r1;
    if (!aOwn && cy !== above) continue;
    const ny1 = cy + 1 >= rows ? 0 : cy + 1;
    const offYDown = cy + 1 >= rows ? H : 0;
    const downOwn = ny1 >= r0 && ny1 < r1;
    for (let cx = 0; cx < cols; cx++) {
      const c = cy * cols + cx;
      const s0 = cs[c], e0 = cs[c + 1];
      if (s0 === e0) continue;
      for (let m = 0; m < 5; m++) {
        let q0, q1, offX = 0, offY = 0, bOwn;
        if (m === 0) { q0 = s0; q1 = e0; bOwn = aOwn; }
        else {
          let nx = (m === 1 || m === 4) ? cx + 1 : (m === 2 ? cx - 1 : cx);
          let ny = cy;
          if (nx < 0) { nx += cols; offX = -W; } else if (nx >= cols) { nx -= cols; offX = W; }
          if (m === 1) bOwn = aOwn;
          else { ny = ny1; offY = offYDown; bOwn = downOwn; }
          const q = ny * cols + nx;
          q0 = cs[q]; q1 = cs[q + 1];
          if (q0 === q1) continue;
        }
        if (!aOwn && !bOwn) continue;
        for (let a = s0; a < e0; a++) {
          const xa = sx[a] - offX, ya = sy[a] - offY;
          const ta = st[a], rowA = ta * nTypes;
          let fxa = 0, fya = 0;
          for (let b = (m === 0 ? a + 1 : q0); b < q1; b++) {
            const dx = sx[b] - xa;
            const dy = sy[b] - ya;
            const d2 = dx * dx + dy * dy;
            if (d2 >= rMax2 || d2 === 0) continue;
            const d = Math.sqrt(d2);
            const invD = 1 / d;
            const tb = st[b];
            const kab = rowA + tb, kba = tb * nTypes + ta;
            if (d2 < R2[kab]) {
              const r = d * IR[kab], bt = B[kab];
              const sc = r < bt ? (r * IB[kab] - 1) * invD : M[kab] * (1 - Math.abs(2 * r - 1 - bt) * IOMB[kab]) * invD;
              fxa += dx * sc; fya += dy * sc;
            }
            if (bOwn && d2 < R2[kba]) {
              const r = d * IR[kba], bt = B[kba];
              const sc = r < bt ? (r * IB[kba] - 1) * invD : M[kba] * (1 - Math.abs(2 * r - 1 - bt) * IOMB[kba]) * invD;
              fx[b] -= dx * sc; fy[b] -= dy * sc;
            }
          }
          if (aOwn) { fx[a] += fxa; fy[a] += fya; }
        }
      }
    }
  }
}

function workerMain() {
  let fx = new Float32Array(0), fy = new Float32Array(0);
  self.onmessage = (e) => {
    const j = e.data;
    if (fx.length < j.n) { fx = new Float32Array(j.n); fy = new Float32Array(j.n); }
    const t0 = performance.now();
    const s = j.cs[j.r0 * j.cols], t = j.cs[j.r1 * j.cols];   // 自分の粒子 (セル順で連続)
    fx.fill(0, s, t); fy.fill(0, s, t);
    if (j.pp) {
      bandForcesPP(j.r0, j.r1, j.cols, j.rows, j.W, j.H, j.rMax2, j.nTypes, j.M,
                   j.pp.R2, j.pp.IR, j.pp.B, j.pp.IB, j.pp.IOMB, j.sx, j.sy, j.st, j.cs, fx, fy);
    } else {
      bandForces(j.r0, j.r1, j.cols, j.rows, j.W, j.H, j.rMax2, j.invRMax, j.beta, j.nTypes,
                 j.M, j.sx, j.sy, j.st, j.cs, fx, fy);
    }
    const ox = fx.slice(s, t), oy = fy.slice(s, t);
    self.postMessage({ job: j.job, s, ox, oy, ms: performance.now() - t0 }, [ox.buffer, oy.buffer]);
  };
}

const par = (() => {
  const workers = [];
  try {
    const hc = navigator.hardwareConcurrency || 2;
    const nW = Math.max(1, Math.min(MAX_WORKERS, hc - 1));
    if (hc >= 2 && typeof Worker !== 'undefined') {
      const src = `'use strict';\n${bandForces.toString()}\n${bandForcesPP.toString()}\n(${workerMain.toString()})();`;
      const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      for (let i = 0; i < nW; i++) workers.push(new Worker(url));
    }
  } catch (e) { console.warn('Worker 初期化失敗 (メインスレッドで計算します):', e); workers.length = 0; }

  let job = 0;            // 送信ごとの番号。古い返信を捨てるのに使う
  let jobVersion = -1, jobN = 0, jobTime = 0;
  let waiting = 0;        // 未着の返信数 (0 かつ job 有効 = 力が揃っている)
  let jobCpuMs = 0;       // そのジョブで全 Worker が使った計算時間の合計
  let active = false;     // 重いときだけ並列化 (軽いときは余計な CPU を使わない)
  let enabled = workers.length > 0;
  const rowCost = new Float64Array(1024);

  function disable(e) {
    if (!enabled) return;
    console.warn('Worker エラー (メインスレッドで計算します):', e);
    enabled = false; job++;
    workers.forEach((w) => w.terminate());
  }
  workers.forEach((w) => {
    w.onerror = disable;
    w.onmessage = (e) => {
      const r = e.data;
      if (r.job !== job) return;                  // 古いジョブ
      forceX.set(r.ox, r.s); forceY.set(r.oy, r.s);
      jobCpuMs += r.ms;
      if (--waiting === 0) {
        lastLatencyMs = performance.now() - jobTime;
        // 全 Worker の合計時間 ≒ 1 スレッドで計算した場合の時間。軽くなったら並列化をやめる
        if (jobCpuMs < PAR_OFF_MS) active = false;
      }
    };
  });
  let lastLatencyMs = 0;  // 直近のジョブで、送ってから全員の結果が揃うまでの時間

  return {
    get count() { return enabled ? workers.length : 0; },
    get lastLatencyMs() { return lastLatencyMs; },
    /** 送ってから今までの経過時間 (結果待ちのとき) */
    get pendingMs() { return waiting > 0 ? performance.now() - jobTime : 0; },
    /** メインスレッドで力を計算したステップの時間から、並列化を始めるか決める */
    observe(stepMs) {
      if (enabled && !active && stepMs > PAR_ON_MS) active = true;
    },
    /** 現在の状態 (粒子数 n) の力が揃っていれば true (forceX/forceY とビン分けは設定済み)。
     *  ジョブは使っても使わなくてもこの呼び出しで無効になる (遅れて届いた返信は捨てる) */
    takeResult(n) {
      const ok = enabled && jobVersion === simVersion && jobN === n && waiting === 0;
      jobVersion = -1; job++;
      return ok;
    },
    /** まだ届いていない有効なジョブがあるか (あればこのフレームは step を待つ) */
    inFlight(n) {
      return enabled && jobVersion === simVersion && jobN === n && waiting > 0 &&
             performance.now() - jobTime <= WORKER_TIMEOUT_MS;
    },
    dispatch(n) {
      if (!enabled || !active || matrixLerpT < 1) return;
      binParticles(n);   // 次のステップの分を今ビン分けしておく (step では再利用)
      const cols = gridCols, rows = gridRows;
      // 各行の計算量を「セル内の粒子数 × (自分の半分 + 前方4セル)」で見積もり、均等に分ける
      let total = 0;
      for (let cy = 0; cy < rows; cy++) {
        let rc = 0;
        const ny = cy + 1 >= rows ? 0 : cy + 1;
        for (let cx = 0; cx < cols; cx++) {
          const c = cy * cols + cx, k = cellStart[c + 1] - cellStart[c];
          if (k === 0) continue;
          const xr = cx + 1 >= cols ? 0 : cx + 1, xl = cx === 0 ? cols - 1 : cx - 1;
          const cnt = (q) => cellStart[q + 1] - cellStart[q];
          rc += k * (k * 0.5 + cnt(cy * cols + xr) + cnt(ny * cols + xl) + cnt(ny * cols + cx) + cnt(ny * cols + xr));
        }
        rowCost[cy] = rc; total += rc;
      }
      const nb = Math.min(workers.length, rows);
      job++; jobVersion = simVersion; jobN = n; jobTime = performance.now(); waiting = 0; jobCpuMs = 0;
      const base = {
        job, n, cols, rows, W: worldW, H: worldH, rMax2: params.rMax * params.rMax, invRMax: 1 / params.rMax,
        beta: params.beta, nTypes: numTypes, M: matrix.slice(),
        sx: sortX.slice(0, n), sy: sortY.slice(0, n), st: sortT.slice(0, n),
        cs: cellStart.slice(0, cols * rows + 1), r0: 0, r1: 0,
        pp: null,
      };
      if (!rangesAreUniform) {
        const T = pairTables(), nn = numTypes * numTypes;
        base.pp = { R2: T.R2.slice(0, nn), IR: T.IR.slice(0, nn), B: T.B.slice(0, nn), IB: T.IB.slice(0, nn), IOMB: T.IOMB.slice(0, nn) };
      }
      let r0 = 0, acc = 0;
      for (let w = 0; w < nb && r0 < rows; w++) {
        let r1 = r0;
        const target = total * (w + 1) / nb;
        do { acc += rowCost[r1]; r1++; } while (r1 < rows && acc + rowCost[r1] * 0.5 <= target && rows - r1 > nb - w - 1);
        if (w === nb - 1) { for (; r1 < rows; r1++) acc += rowCost[r1]; }
        base.r0 = r0; base.r1 = r1;
        workers[w].postMessage(base);
        waiting++;
        r0 = r1;
      }
    },
  };
})();

/* =====================================================================
 *  描画: WebGL (加算合成 + ソフトグロー + 残像)。使えなければ Canvas2D
 *  どちらも { name, resize(w,h,dpr), onCountChanged(n, from), draw(n) } を持つ。
 *  WebGL 版はさらに GPU 計算エンジン用に { gl, isGL2, quadBuf, program } を公開する
 * ===================================================================== */
const canvas = document.getElementById('view');

function createWebGLRenderer() {
  const ctxAttribs = {
    alpha: false, antialias: false, depth: false, stencil: false,
    preserveDrawingBuffer: true,   // 残像のため前フレームを保持
    powerPreference: 'high-performance',
  };
  // WebGL2 なら GPU 計算エンジンも使える。描画自体は WebGL1 と同じシェーダ・同じ手順
  let gl = canvas.getContext('webgl2', ctxAttribs);
  let isGL2 = !!gl;
  if (!gl) gl = canvas.getContext('webgl', ctxAttribs);
  if (!gl) return null;

  function compile(kind, src) {
    const s = gl.createShader(kind);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(vs, fs, attribs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    attribs.forEach((name, loc) => gl.bindAttribLocation(p, loc, name));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  // 粒子: 位置 (CSS px) とタイプを受け取り、点スプライトとして描く
  // x, y は posX / posY をそのまま別々のバッファで受け取る (詰め替え不要)
  const pointProg = program(`
    attribute float aX;
    attribute float aY;
    attribute float aType;
    uniform vec2 uWorld;
    uniform float uSize;
    uniform vec3 uColors[${MAX_TYPES}];
    varying vec3 vColor;
    void main() {
      vec2 aPos = vec2(aX, aY);
      vec2 clip = aPos / uWorld * 2.0 - 1.0;
      gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
      gl_PointSize = uSize;
      vColor = uColors[int(aType + 0.5)];
    }`, `
    precision mediump float;
    varying vec3 vColor;
    uniform float uAlpha;
    void main() {
      vec2 p = gl_PointCoord * 2.0 - 1.0;
      float d2 = dot(p, p);
      if (d2 > 1.0) discard;
      // 明るい芯 + 柔らかい外周 = 安価なグロー
      float glow = exp(-d2 * 5.0) + (1.0 - d2) * 0.15;
      gl_FragColor = vec4(vColor * glow * uAlpha, 1.0);
    }`, ['aX', 'aY', 'aType']);

  // 全画面四角形: 残像のフェード用
  const fadeProg = program(`
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`, `
    precision mediump float;
    uniform vec4 uColor;
    void main() { gl_FragColor = uColor; }`, ['aPos']);

  const uWorld  = gl.getUniformLocation(pointProg, 'uWorld');
  const uSize   = gl.getUniformLocation(pointProg, 'uSize');
  const uColors = gl.getUniformLocation(pointProg, 'uColors');
  const uAlpha  = gl.getUniformLocation(pointProg, 'uAlpha');
  const uFadeColor = gl.getUniformLocation(fadeProg, 'uColor');


  // GPU 計算中の描画: 位置を GPU 上の状態テクスチャから直接読む (CPU への読み戻し・転送なし)。
  // 点の形・色・明るさの計算は上の pointProg と同一
  let texProg = null, uTexWorld, uTexSize, uTexState, uTexW, uTexAlpha, uTexColors;
  if (isGL2) try {
    texProg = program(`#version 300 es
      layout(location = 0) in float aType;
      uniform highp sampler2D uState;
      uniform int uTexW;
      uniform vec2 uWorld;
      uniform float uSize;
      uniform vec3 uColors[${MAX_TYPES}];
      out vec3 vColor;
      void main() {
        vec2 aPos = texelFetch(uState, ivec2(gl_VertexID % uTexW, gl_VertexID / uTexW), 0).xy;
        vec2 clip = aPos / uWorld * 2.0 - 1.0;
        gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
        gl_PointSize = uSize;
        vColor = uColors[int(aType + 0.5)];
      }`, `#version 300 es
      precision mediump float;
      in vec3 vColor;
      uniform float uAlpha;
      out vec4 outColor;
      void main() {
        vec2 p = gl_PointCoord * 2.0 - 1.0;
        float d2 = dot(p, p);
        if (d2 > 1.0) discard;
        float glow = exp(-d2 * 5.0) + (1.0 - d2) * 0.15;
        outColor = vec4(vColor * glow * uAlpha, 1.0);
      }`, ['aType']);
    uTexWorld = gl.getUniformLocation(texProg, 'uWorld');
    uTexSize  = gl.getUniformLocation(texProg, 'uSize');
    uTexState = gl.getUniformLocation(texProg, 'uState');
    uTexW     = gl.getUniformLocation(texProg, 'uTexW');
    uTexAlpha = gl.getUniformLocation(texProg, 'uAlpha');
    uTexColors = gl.getUniformLocation(texProg, 'uColors');
    gl.useProgram(texProg);
    gl.uniform1i(uTexState, 0);
  } catch (e) { console.warn('GPU 計算用の描画シェーダを作れません (CPU で計算します):', e); texProg = null; isGL2 = false; }

  const quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

  // 頂点データ: x, y (描くたびに転送) と type (粒子数が変わったときだけ転送)。GPU 側は最大サイズで確保
  const typeData = new Float32Array(MAX_COUNT);
  let xView = posX.subarray(0, params.count), yView = posY.subarray(0, params.count); // 粒子数変更時のみ作り直す
  const xBuf = gl.createBuffer(), yBuf = gl.createBuffer(), typeBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, xBuf);
  gl.bufferData(gl.ARRAY_BUFFER, MAX_COUNT * 4, gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, yBuf);
  gl.bufferData(gl.ARRAY_BUFFER, MAX_COUNT * 4, gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, typeBuf);
  gl.bufferData(gl.ARRAY_BUFFER, MAX_COUNT * 4, gl.STATIC_DRAW);

  const sizeRange = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE);
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.clearColor(0, 0, 0, 1);

  let dpr = 1;
  /** 点の大きさ・明るさを反映 (詳細設定で変えたとき) */
  function applyStyle() {
    const size = Math.min(params.pointSize * dpr, sizeRange[1]);
    gl.useProgram(pointProg);
    gl.uniform1f(uSize, size); gl.uniform1f(uAlpha, params.pointAlpha);
    gl.uniform3fv(uColors, TYPE_COLORS);
    if (texProg) {
      gl.useProgram(texProg);
      gl.uniform1f(uTexSize, size); gl.uniform1f(uTexAlpha, params.pointAlpha);
      gl.uniform3fv(uTexColors, TYPE_COLORS);
    }
  }
  applyStyle();

  return {
    name: 'WebGL',
    gl, isGL2, quadBuf, program,
    applyStyle,
    resize(w, h, newDpr) {
      dpr = newDpr;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.useProgram(pointProg);
      gl.uniform2f(uWorld, w, h);
      if (texProg) { gl.useProgram(texProg); gl.uniform2f(uTexWorld, w, h); }
      applyStyle();
      gl.clear(gl.COLOR_BUFFER_BIT);
    },
    onCountChanged(n, from = 0) {
      xView = posX.subarray(0, n); yView = posY.subarray(0, n);
      if (n <= from) return;                       // 減ったときは送り直さない
      for (let i = from; i < n; i++) typeData[i] = type[i];
      gl.bindBuffer(gl.ARRAY_BUFFER, typeBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER, from * 4, typeData.subarray(from, n));
    },
    draw(n) {
      // --- 残像: 前フレームを暗くする (乗算) → 少しだけ引く (8bit の残りカス対策) ---
      gl.useProgram(fadeProg);
      gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      gl.disableVertexAttribArray(1);
      gl.disableVertexAttribArray(2);
      gl.blendEquation(gl.FUNC_ADD);
      gl.blendFunc(gl.ZERO, gl.ONE_MINUS_SRC_ALPHA);      // dst *= (1 - fade)
      gl.uniform4f(uFadeColor, 0, 0, 0, params.trailFade);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.blendEquation(gl.FUNC_REVERSE_SUBTRACT);          // dst -= floor
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.uniform4f(uFadeColor, TRAIL_FLOOR, TRAIL_FLOOR, TRAIL_FLOOR, 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      // --- 粒子: 加算合成 ---
      if (gpu && gpu.active) {
        gl.useProgram(texProg);
        gl.uniform1i(uTexW, gpu.texW);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, gpu.stateTexture);
        gl.bindBuffer(gl.ARRAY_BUFFER, typeBuf);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 1, gl.FLOAT, false, 0, 0);
        gl.disableVertexAttribArray(1);
        gl.blendEquation(gl.FUNC_ADD);
        gl.blendFunc(gl.ONE, gl.ONE);
        gl.drawArrays(gl.POINTS, 0, n);
        return;
      }
      gl.useProgram(pointProg);
      gl.bindBuffer(gl.ARRAY_BUFFER, xBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, xView);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 1, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, yBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, yView);
      gl.enableVertexAttribArray(1);
      gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, typeBuf);
      gl.enableVertexAttribArray(2);
      gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 0, 0);
      gl.blendEquation(gl.FUNC_ADD);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.drawArrays(gl.POINTS, 0, n);
    },
  };
}

/* =====================================================================
 *  GPU 計算エンジン (WebGL2 + 浮動小数テクスチャ)
 *
 *  粒子が多すぎて CPU (Worker 並列) が追いつかないときに使う。状態は GPU 上に置いたまま:
 *    1) 各粒子のセル番号を求める          (keys: [セル, 粒子番号]。粒子数ぶんの行だけ)
 *    2) 昇順だけのバイトニックソートでセル順に並べる (間隔 16 未満の比較は 16 個まとめて1パス)
 *    3) 各セルの開始位置を二分探索で求める
 *    4) 位置・タイプ・粒子番号をセル順に詰め直す
 *    5) セル順に (= 近くの粒子どうしをまとめて) 、半径 rMax の円に掛かるセルだけを走査して力を求め、
 *       速度・位置を更新して result へ書く。近傍は 4 個ずつ先読み、係数は小さなテクスチャから読む
 *       (セルは rMax/5 角 (セル数が多すぎる画面では粗く)。行ごとに円の弦の範囲だけを1区間として読む)
 *    6) result を粒子番号の位置へ書き戻す (1画素の点を粒子数だけ描く)
 *  5) は描画命令を分けて出す。分け方は、力のパスが数えた近傍候補の数を数ステップおきに非同期で読み戻した実測による
 *  テクスチャやシェーダは初めて GPU 計算に切り替えたときに作る (使わなければメモリを使わない)
 *  描画は状態テクスチャから直接位置を読む。力の式・摩擦・破壊・トーラスは CPU 版と同じ。
 *  (GPU は 32bit 浮動小数で計算するため、CPU 版とは丸め誤差の分だけ値が異なる)
 * ===================================================================== */
function createGpuSim(r) {
  const gl = r.gl;
  if (!r.isGL2 || !gl.getExtension('EXT_color_buffer_float')) return null;

  const TEXW = 1024;
  const stateRows = Math.ceil(MAX_COUNT / TEXW);
  // 力のパスで、セル順に連続する粒子を置く画素のタイル (幅×高さ。2 のべき乗)
  const TILE_LOG_W = 2, TILE_LOG_H = 3, TILE_W = 1 << TILE_LOG_W, TILE_H = 1 << TILE_LOG_H;
  const SORT_LOCAL = 16;                      // ソートで1パスにまとめる塊の大きさ (2 のべき乗)
  let npadMax = 1024; while (npadMax < MAX_COUNT) npadMax *= 2;
  const keyRowsMax = npadMax / TEXW;
  const CELL_ROWS = 1024;                     // (セル数 × 色数) の上限 = TEXW × CELL_ROWS - 1
  const MAX_CELLS = TEXW * CELL_ROWS - 1;
  // 力のパスは描画命令を分けて出す (1回が長いと OS が GPU をリセットするため)。
  // 仕事量 = 各粒子が調べる近傍候補の数。力のパスが粒子ごとに数えて GPU 上で区画ごとに合計し、
  // 数ステップおきに非同期で読み戻す (待たない)。その実測で、1回の仕事がそろうように区切る。
  // 実測がまだない (粒子数を変えた直後など) ときは、一様分布での見積もり × 凝集の分の係数で均等に分ける。
  // さらに実際のフレーム時間が長ければ細かく分ける
  const WORK_PER_DRAW = 2e8;                  // 1回の描画命令で調べる近傍候補の目安
  const CLUSTER_FACTOR = 4;                   // 見積もり時: 凝集で候補が一様分布より増える分の見込み
  let drawsHint = 1;                          // 実測から決めた最低分割数
  const TARGET_DRAW_MS = 50;                  // 描画命令 1 回の目標時間 [ms]
  const MAX_DRAWS = 4096;                     // 分割数の上限 (命令を出すこと自体の負担を抑える)
  const FLUSH_WORK = 2e9;                     // これだけの近傍候補の仕事ごとに GPU へ送る (gl.flush)
  const FLUSH_EVERY_SLOW = 4;                 // 実測で遅いときは描画命令この回数ごとに送る
  const WORK_CHUNK = 64;                      // 仕事量を合計する区画の幅 (1行を 1024/64 = 16 区画)
  const MEASURE_EVERY = 4;                    // 仕事量を測るステップ間隔
  // GPU 用のグリッド (CPU 版とは別)。セル = rMax / sub。sub >= 2 なら走査範囲が重ならない。
  // セルが細かいほど円に沿って無駄なく読める (行が増える負担と釣り合うのが sub = 5 前後)。
  // 並び順は (セルの行, 色, セルの列)。行と色が同じなら列方向に連続するので、
  // 「ある行のある色」の候補が1区間で読め、係数は区間ごとに1回だけ引けばよい
  const GPU_SUB = 5;
  let gCols = 1, gRows = 1, gCellW = 1, gCellH = 1, gTypes = 1;
  function gpuGrid() {
    for (let sub = GPU_SUB; sub >= 2; sub--) {
      const c = Math.floor(worldW * sub / params.rMax), rr = Math.floor(worldH * sub / params.rMax);
      if (c * rr * numTypes <= MAX_CELLS) {
        gCols = c; gRows = rr; gCellW = worldW / c; gCellH = worldH / rr; gTypes = numTypes; return true;
      }
    }
    return false;
  }
  if (gl.getParameter(gl.MAX_TEXTURE_SIZE) < Math.max(TEXW, keyRowsMax)) return null;

  function build() {
    function tex(fmt, w, h) {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texStorage2D(gl.TEXTURE_2D, 1, fmt, w, h);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      const fb = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
      const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      if (!ok) throw new Error('float framebuffer incomplete');
      return { t, fb };
    }
    const state  = [tex(gl.RGBA32F, TEXW, stateRows), tex(gl.RGBA32F, TEXW, stateRows)]; // x, y, vx, vy
    const types  = tex(gl.R32F, TEXW, stateRows);
    const keys   = [tex(gl.RG32F, TEXW, keyRowsMax), tex(gl.RG32F, TEXW, keyRowsMax)];  // セル, 粒子番号
    const sorted = tex(gl.RGBA32F, TEXW, keyRowsMax);                                    // x, y, type, 粒子番号 (セル順)
    // 近傍の走査用: 1画素に2粒子分の位置 (x0, y0, x1, y1)。読み込み回数が半分になる
    // (力のパスは読み込みの回数で頭打ちになっている)
    const spos   = tex(gl.RGBA32F, TEXW, keyRowsMax / 2);
    const cells  = tex(gl.R32F, TEXW, CELL_ROWS);                                        // 各セルの開始位置
    const fRowsMax = Math.ceil(stateRows / TILE_H) * TILE_H;
    const result = tex(gl.RGBA32F, TEXW, fRowsMax);                                      // 力のパスの結果 (セル順, タイル配置)
    // 仕事量の実測: 力のパスが result と同時に粒子ごとの候補数を workTex に書く (MRT)。
    // workSum = 各行の 16 区画の合計 (1 画素に 4 区画)。使えない環境では実測なしで動く
    const workTex = tex(gl.R32F, TEXW, fRowsMax);

    // 色の組ごとの値 (行 = 自分の色, 列 = 相手の色): 係数, 最大距離 [px], 反発距離の割合。

    const VS = `#version 300 es
      layout(location = 0) in vec2 aPos;

      precision highp float; precision highp int; precision highp sampler2D;
      layout(location = 0) out vec4 o;
      ivec2 at(int i, int w) { return ivec2(i & 1023, i >> 10); }   // テクスチャ幅は 1024 固定

      uniform sampler2D uState, uType; uniform int uN, uW, uNT;
      void main() {

    // ソート: 昇順だけのバイトニック (各段の最初は区間を折り返して比べる)。
    // 比べた2つのうち番号の小さい側へ小さいキーを置くので、位置 >= n の「無限大」は最後まで動かない

    const KEY_AT = `
      vec2 keyAt(int i) { return i < uN ? texelFetch(uKeys, at(i, uW), 0).xy : vec2(1.0e9, float(i)); }

    const sortP = prog(`
      uniform sampler2D uKeys; uniform int uW, uN, uJ, uFlip;
      ${KEY_AT}
      void main() {
        int s = here(uW), t = uFlip == 1 ? s ^ (2 * uJ - 1) : s ^ uJ;
        vec2 a = keyAt(s), b = keyAt(t);

      }`, ['uKeys', 'uW', 'uN', 'uJ', 'uFlip']);
    // 間隔が SORT_LOCAL / 2 以下の比較は、SORT_LOCAL 個の塊をまとめて読んで1パスで済ませる
    // (uLocal = 1: 塊の中を最初から並べる / 0: 各段の残りの間隔 SORT_LOCAL/2 .. 1 だけ)
    const ce = (a, b) => `{ bool w = less(e[${b}], e[${a}]); vec2 x = e[${a}]; e[${a}] = w ? e[${b}] : x; e[${b}] = w ? x : e[${b}]; }`;
    const layer = (j, flip) => {
      let src = '';
      for (let i = 0; i < SORT_LOCAL; i++) {
        const t = flip ? i ^ (2 * j - 1) : i ^ j;
        if (i < t) src += ce(i, t);

    let fullNet = '';
    for (let k = 2; k <= SORT_LOCAL; k *= 2) {

      for (let j = k / 4; j >= 1; j /= 2) fullNet += layer(j, false);

    for (let j = SORT_LOCAL / 2; j >= 1; j /= 2) tailNet += layer(j, false);
    const sortLocalP = prog(`
      uniform sampler2D uKeys; uniform int uW, uN, uLocal;
      ${KEY_AT}
      void main() {
        int s = here(uW), base = s & ${~(SORT_LOCAL - 1)};
        vec2 e[${SORT_LOCAL}];
        for (int i = 0; i < ${SORT_LOCAL}; i++) e[i] = keyAt(base + i);

      }`, ['uKeys', 'uW', 'uN', 'uLocal']);

    const cellP = prog(`
      uniform sampler2D uKeys; uniform int uW, uN, uCells;
      void main() {
        int c = here(uW);
        if (c > uCells) { o = vec4(0.0); return; }
        float fc = float(c);
        int lo = 0, hi = uN;                           // 最初に key >= c となる位置 (なければ n)

      uniform sampler2D uKeys, uState, uType; uniform int uW, uN;
      void main() {

        if (s >= uN) { o = vec4(0.0); return; }

      uniform sampler2D uSorted; uniform int uW;
      void main() {

    const stepP = prog(CELL_OF + `

      uniform float uRMax, uFriction, uAccScale, uDt;

              }

                vec4 p01 = texelFetch(uSPos, at(s >> 1, uW), 0);
                ${ACC('p01.xy')}
                if (s + 1 < s1) ${ACC('p01.zw')}
              }

        p.y = wrapAxis(p.y, uWorld.y);
        o = vec4(p, v);
        oWork = vec4(float(cand), 0.0, 0.0, 0.0);
      }`, ['uState', 'uSorted', 'uSPos', 'uCells', 'uW', 'uN', 'uNT', 'uWorld', 'uRMax', 'uFriction',
           'uAccScale', 'uDt', 'uMat', 'uInput', 'uCell', 'uCols', 'uRows', 'uBeta', 'uPR', 'uPF']);

    // セル順の結果 → 粒子番号の位置へ書き戻す (1画素の点を n 個描く。各粒子ちょうど1回書かれる)
    const scatterP = (() => {
      const p = r.program(`#version 300 es
        precision highp float; precision highp int; precision highp sampler2D;
        uniform sampler2D uResult, uSorted; uniform int uRows;
        flat out vec4 vVal;
        void main() {
          int s = gl_VertexID, t = s >> ${TILE_LOG_W + TILE_LOG_H}, w = s & ${TILE_W * TILE_H - 1};

                                           ((t >> ${Math.log2(TEXW / TILE_W)}) << ${TILE_LOG_H}) + (w >> ${TILE_LOG_W})), 0);

    // 仕事量: 各行の WORK_CHUNK 画素ずつの合計 (1 画素に 4 区画分)

      uniform sampler2D uWork;
      void main() {
        ivec2 p = ivec2(gl_FragCoord.xy);
        vec4 r = vec4(0.0);
        for (int c = 0; c < 4; c++) {

        }
        o = r;
      }`, ['uWork']);

    const scaleP = prog(`
      uniform sampler2D uState; uniform int uW, uN; uniform vec2 uScale, uWorld;
      void main() {
        int i = here(uW);

    let workReq = null;          // 読み戻し待ち { sync, key, rows }
    let work = null;             // 最新の実測 { key, rows, data, total }

      for (let y = 0; y < w.rows; y += TILE_H) {
        let bw = 0;
        cw.fill(0);
        for (let r = y; r < y + TILE_H; r++) for (let c = 0; c < CHUNKS; c++) cw[c] += w.data[r * CHUNKS + c];
        for (let c = 0; c < CHUNKS; c++) bw += cw[c];

        if (bw <= budget) { cur = { x: 0, y, w: TEXW, h: TILE_H, work: bw }; rects.push(cur); continue; }

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.enable(gl.BLEND);
    }

      gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb);
      gl.viewport(0, 0, TEXW, rows);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    const sim = {
      get active() { return active; },
      get enterCount() { return enterCount; },
      get stateTexture() { return state[cur].t; },
      get drawInfo() { return drawInfo; },
      texW: TEXW,
      /** 今の粒子数とグリッドで GPU 計算できるか */
      fits() { return gpuGrid(); },
      /** CPU 側の配列 → GPU */
      upload() {
        const n = params.count, rows = rowsFor(n);
        for (let i = 0; i < n; i++) {
          io[i * 4] = posX[i]; io[i * 4 + 1] = posY[i]; io[i * 4 + 2] = velX[i]; io[i * 4 + 3] = velY[i];
          typeIo[i] = type[i];
        }
        gl.bindTexture(gl.TEXTURE_2D, state[cur].t);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, TEXW, rows, gl.RGBA, gl.FLOAT, io, 0);
        gl.bindTexture(gl.TEXTURE_2D, types.t);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, TEXW, rows, gl.RED, gl.FLOAT, typeIo, 0);
        work = null;                             // 前の状態の仕事量の実測は使わない
        if (workReq) workReq.key = '';
        simVersion++;
      },
      /** GPU → CPU 側の配列 */
      download() {
        if (gl.isContextLost()) return;          // 読めない (古い io を配列に写さない)。復帰時はページを読み込み直す
        const n = params.count, rows = rowsFor(n);
        gl.bindFramebuffer(gl.FRAMEBUFFER, state[cur].fb);
        gl.readPixels(0, 0, TEXW, rows, gl.RGBA, gl.FLOAT, io, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        for (let i = 0; i < n; i++) {
          posX[i] = io[i * 4]; posY[i] = io[i * 4 + 1]; velX[i] = io[i * 4 + 2]; velY[i] = io[i * 4 + 3];
        }
        simVersion++;
      },
      /** 粒子 [from, to) だけを CPU 側の配列から GPU に送る (粒子数を増やしたとき) */
      uploadRange(from, to) {
        for (let i = from; i < to; i++) {
          io[i * 4] = posX[i]; io[i * 4 + 1] = posY[i]; io[i * 4 + 2] = velX[i]; io[i * 4 + 3] = velY[i];
          typeIo[i] = type[i];
        }
        const r0 = Math.floor(from / TEXW), x0 = from - r0 * TEXW, r1 = rowsFor(to);
        const put = (t, fmt, data, ch) => {
          gl.bindTexture(gl.TEXTURE_2D, t);
          if (x0 > 0) {   // 途中から始まる最初の行
            gl.texSubImage2D(gl.TEXTURE_2D, 0, x0, r0, TEXW - x0, 1, fmt, gl.FLOAT, data, (r0 * TEXW + x0) * ch);
          }
          const rs = x0 > 0 ? r0 + 1 : r0;
          if (r1 > rs) gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, rs, TEXW, r1 - rs, fmt, gl.FLOAT, data, rs * TEXW * ch);
        };
        put(state[cur].t, gl.RGBA, io, 4);
        put(types.t, gl.RED, typeIo, 1);
        simVersion++;
      },
      rescale(sx, sy) {
        const n = params.count, rows = rowsFor(n);
        gl.disable(gl.BLEND);
        bindQuad();
        gl.useProgram(scaleP.p);
        bindTex(0, state[cur].t);
        gl.uniform1i(scaleP.u.uState, 0); gl.uniform1i(scaleP.u.uW, TEXW); gl.uniform1i(scaleP.u.uN, n);
        gl.uniform2f(scaleP.u.uScale, sx, sy); gl.uniform2f(scaleP.u.uWorld, worldW, worldH);
        pass(scaleP, state[1 - cur], rows);
        cur = 1 - cur;
        restoreDrawState();
        simVersion++;
      },
      /** 実際のフレーム間隔 [ms] から、力のパスの分割数を調整する */
      noteFrameMs(ms) {
        // 1フレームをほぼ力のパスとみなし、1回あたり TARGET_DRAW_MS 以下になる分割数にする
        // (分割数 = フレーム時間 / 目標。前回の分割数を掛けると「分けるほど遅くなる」暴走になる)
        if (ms > 4 * TARGET_DRAW_MS) drawsHint = Math.min(MAX_DRAWS, Math.max(drawsHint, Math.ceil(ms / TARGET_DRAW_MS)));
        else if (ms < 40 && drawsHint > 1) drawsHint = Math.max(1, Math.floor(drawsHint * 0.9));
      },
      enter() { if (active || !sim.fits()) return; sim.upload(); active = true; enterCount = params.count; },
      exit()  { if (!active) return; sim.download(); active = false; },
      step(dt, friction, accScale) {
        if (!sim.fits()) { sim.exit(); return; }
        const n = params.count;
        let npad = 1024; while (npad < n) npad *= 2;
        const rows = rowsFor(n), nCells = gCols * gRows * gTypes;   // 区間 (行, 色, 列) の数

        gl.disable(gl.BLEND);
        bindQuad();

        // 1) keys
        gl.useProgram(keyP.p);
        bindTex(0, state[cur].t); bindTex(1, types.t);
        gl.uniform1i(keyP.u.uState, 0); gl.uniform1i(keyP.u.uType, 1); gl.uniform1i(keyP.u.uN, n); gl.uniform1i(keyP.u.uW, TEXW);
        gl.uniform1i(keyP.u.uNT, gTypes);
        gl.uniform2f(keyP.u.uCell, gCellW, gCellH); gl.uniform1i(keyP.u.uCols, gCols); gl.uniform1i(keyP.u.uRows, gRows);
        pass(keyP, keys[0], rows);

        // 2) bitonic sort (段 k = 2 .. npad。間隔 SORT_LOCAL/2 以下はまとめて1パス)
        let src = 0;
        const sortPass = (p) => { bindTex(0, keys[src].t); pass(p, keys[1 - src], rows); src = 1 - src; };
        gl.useProgram(sortLocalP.p);
        gl.uniform1i(sortLocalP.u.uKeys, 0); gl.uniform1i(sortLocalP.u.uW, TEXW); gl.uniform1i(sortLocalP.u.uN, n);
        gl.uniform1i(sortLocalP.u.uLocal, 1);
        sortPass(sortLocalP);                                    // 段 k <= SORT_LOCAL
        for (let k = SORT_LOCAL * 2; k <= npad; k <<= 1) {
          gl.useProgram(sortP.p);
          gl.uniform1i(sortP.u.uKeys, 0); gl.uniform1i(sortP.u.uW, TEXW); gl.uniform1i(sortP.u.uN, n);
          gl.uniform1i(sortP.u.uFlip, 1); gl.uniform1i(sortP.u.uJ, k >> 1);
          sortPass(sortP);                                       // 折り返して比べる
          gl.uniform1i(sortP.u.uFlip, 0);
          for (let j = k >> 2; j >= SORT_LOCAL; j >>= 1) { gl.uniform1i(sortP.u.uJ, j); sortPass(sortP); }
          gl.useProgram(sortLocalP.p);
          gl.uniform1i(sortLocalP.u.uLocal, 0);
          sortPass(sortLocalP);                                  // 間隔 SORT_LOCAL/2 .. 1
        }

        // 3) cell starts
        gl.useProgram(cellP.p);
        bindTex(0, keys[src].t);
        gl.uniform1i(cellP.u.uKeys, 0); gl.uniform1i(cellP.u.uW, TEXW);
        gl.uniform1i(cellP.u.uN, n); gl.uniform1i(cellP.u.uCells, nCells);
        pass(cellP, cells, Math.ceil((nCells + 1) / TEXW));

        // 4) gather
        gl.useProgram(gatherP.p);
        bindTex(0, keys[src].t); bindTex(1, state[cur].t); bindTex(2, types.t);
        gl.uniform1i(gatherP.u.uKeys, 0); gl.uniform1i(gatherP.u.uState, 1); gl.uniform1i(gatherP.u.uType, 2);
        gl.uniform1i(gatherP.u.uW, TEXW); gl.uniform1i(gatherP.u.uN, n);
        pass(gatherP, sorted, rows);
        gl.useProgram(packP.p);
        bindTex(0, sorted.t);
        gl.uniform1i(packP.u.uSorted, 0); gl.uniform1i(packP.u.uW, TEXW);
        pass(packP, spos, rowsFor(Math.ceil(n / 2)));

        // 5) forces + integrate (セル順で計算し result へ)
        gl.useProgram(stepP.p);
        for (let a = 0; a < numTypes; a++) for (let b = 0; b < numTypes; b++) {
          const k = a * numTypes + b, o = (a * MAX_TYPES + b) * 4;
          mIo[o] = matrix[k]; mIo[o + 1] = params.rMax * pairMax[k]; mIo[o + 2] = pairMin[k];
        }
        bindTex(1, mtex.t);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, MAX_TYPES, MAX_TYPES, gl.RGBA, gl.FLOAT, mIo);
        bindTex(0, state[cur].t); bindTex(2, sorted.t); bindTex(3, cells.t); bindTex(4, spos.t);
        const u = stepP.u;
        gl.uniform1i(u.uState, 0); gl.uniform1i(u.uMat, 1); gl.uniform1i(u.uSorted, 2); gl.uniform1i(u.uCells, 3);
        gl.uniform1i(u.uSPos, 4);
        gl.uniform1i(u.uW, TEXW); gl.uniform1i(u.uN, n); gl.uniform1i(u.uNT, gTypes);
        gl.uniform2f(u.uWorld, worldW, worldH);
        gl.uniform2f(u.uCell, gCellW, gCellH); gl.uniform1i(u.uCols, gCols); gl.uniform1i(u.uRows, gRows);
        gl.uniform1f(u.uRMax, params.rMax); gl.uniform1f(u.uFriction, friction);
        gl.uniform1f(u.uAccScale, accScale); gl.uniform1f(u.uDt, dt);
        gl.uniform3f(u.uInput, input.x, input.y, input.active ? 1 : 0);
        gl.uniform1f(u.uBeta, params.beta);
        gl.uniform1f(u.uPR, params.pointerRadius); gl.uniform1f(u.uPF, params.pointerForce);
        // 粒子が非常に多いときは描画命令を分けて、1回が長くなりすぎないようにする
        pollWork();
        const fRows = Math.ceil(rows / TILE_H) * TILE_H, bands = fRows / TILE_H;   // タイル単位で分ける
        const key = workKey(n);
        let rects;
        const measured = !!work && work.key === key && work.rows === fRows;
        if (measured) {
          // 実測あり: 1回の仕事量がそろうように区切る (凝集した所は細かく)
          const draws = Math.min(MAX_DRAWS, Math.max(drawsHint, Math.ceil(work.total / WORK_PER_DRAW)));
          rects = draws <= 1 ? [{ x: 0, y: 0, w: TEXW, h: fRows, work: work.total }] : planByWork(work, work.total / draws);
        } else {
          // 実測なし: 一様分布の見積もり × 凝集の分で、均等に区切る
          const est = CLUSTER_FACTOR * n * n * 4.2 * params.rMax * params.rMax / (worldW * worldH);
          const draws = Math.min(MAX_DRAWS, Math.max(drawsHint, Math.ceil(est / WORK_PER_DRAW)));
          rects = [];
          if (draws <= bands) {
            const chunk = Math.ceil(bands / draws) * TILE_H;
            for (let y0 = 0; y0 < fRows; y0 += chunk) rects.push({ x: 0, y: y0, w: TEXW, h: Math.min(chunk, fRows - y0) });
          } else {
            let w = TEXW; while (w > 16 && bands * (TEXW / w) < draws) w >>= 1;   // タイルの帯をさらに横に分ける
            for (let y0 = 0; y0 < fRows; y0 += TILE_H) for (let x0 = 0; x0 < TEXW; x0 += w) rects.push({ x: x0, y: y0, w, h: TILE_H });
          }
          for (const rc of rects) rc.work = est / rects.length;
        }
        drawInfo = { draws: rects.length, measured, work: measured ? work.total : 0, maxDrawWork: Math.max(...rects.map((rc) => rc.work)) };
        // gl.flush (GPU への送信) は1回ごとの負担が大きいので、FLUSH_WORK ぶんの仕事ごとにだけ送る
        // (実測で遅いと分かっているときは描画命令 FLUSH_EVERY_SLOW 回ごと)
        gl.bindFramebuffer(gl.FRAMEBUFFER, forceFb || result.fb);
        let sinceFlush = 0;
        for (let i = 0; i < rects.length; i++) {
          const rc = rects[i];
          gl.viewport(rc.x, rc.y, rc.w, rc.h);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          sinceFlush += rc.work;
          if (i < rects.length - 1 && (drawsHint > 1 ? (i + 1) % FLUSH_EVERY_SLOW === 0 : sinceFlush >= FLUSH_WORK)) {
            gl.flush(); sinceFlush = 0;
          }
        }

        // 仕事量を測る (数ステップおき。結果は次のフレーム以降に、待たずに受け取る)
        if (forceFb && !workReq && ++stepNo % MEASURE_EVERY === 0) {
          gl.useProgram(workSumP.p);
          bindTex(0, workTex.t); gl.uniform1i(workSumP.u.uWork, 0);
          gl.bindFramebuffer(gl.FRAMEBUFFER, workSum.fb);
          gl.viewport(0, 0, CHUNKS / 4, fRows);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          gl.bindBuffer(gl.PIXEL_PACK_BUFFER, workPbo);
          gl.bufferData(gl.PIXEL_PACK_BUFFER, CHUNKS * fRows * 4, gl.STREAM_READ);   // 読む分ちょうど (全体を読み戻す)
          gl.readPixels(0, 0, CHUNKS / 4, fRows, gl.RGBA, gl.FLOAT, 0);
          gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
          workReq = { sync: gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0), key, rows: fRows };
        }

        // 6) scatter: result (セル順) → 次の状態 (粒子番号順)
        gl.useProgram(scatterP.p);
        bindTex(0, result.t); bindTex(1, sorted.t);
        gl.uniform1i(scatterP.u.uResult, 0); gl.uniform1i(scatterP.u.uSorted, 1); gl.uniform1i(scatterP.u.uRows, rows);
        gl.disableVertexAttribArray(0);                          // 頂点属性は使わない (gl_VertexID だけ)
        gl.bindFramebuffer(gl.FRAMEBUFFER, state[1 - cur].fb);
        gl.viewport(0, 0, TEXW, rows);
        gl.drawArrays(gl.POINTS, 0, n);

        cur = 1 - cur;
        restoreDrawState();
      },
    };
    return sim;
  }

  // 実体は初めて GPU 計算に切り替えるときに作る (テクスチャ約 70MB とシェーダのコンパイル)
  let impl = null, broken = false;
  return {
    texW: TEXW,
    get active() { return !!impl && impl.active; },
    get enterCount() { return impl ? impl.enterCount : 0; },
    get stateTexture() { return impl.stateTexture; },
    get drawInfo() { return impl ? impl.drawInfo : null; },
    fits() { return !broken && gpuGrid(); },
    enter() {
      if (broken) return;
      if (!impl) {
        try { impl = build(); }
        catch (e) { console.warn('GPU 計算の初期化失敗 (CPU で計算します):', e); broken = true; return; }
      }
      impl.enter();
    },
    exit() { if (impl) impl.exit(); },
    download() { if (impl) impl.download(); },
    uploadRange(from, to) { impl.uploadRange(from, to); },
    rescale(sx, sy) { impl.rescale(sx, sy); },
    noteFrameMs(ms) { if (impl && impl.active) impl.noteFrameMs(ms); },
    step(dt, friction, accScale) {
      if (!gpuGrid()) {   // 画面が巨大すぎてセル表に収まらない (実質起きない)。CPU に戻し、粒子数も CPU の上限へ
        impl.exit(); refreshEngineLabel();
        if (params.count > MAX_COUNT_CPU) { setParticleCount(MAX_COUNT_CPU); refreshLabels(); }
        return;
      }
      impl.step(dt, friction, accScale);
    },
  };
}

/* =====================================================================
 *  WebGPU (使えるときはこちらを優先): 描画 + GPU 計算エンジン
 *
 *  描画は WebGL 版と同じ手順・同じ式 (残像の暗くする→少し引く、点は加算合成のソフトグロー)。
 *  点スプライトの代わりに同じ大きさの四角形を粒子ごとに描く (WebGL 版も内部では四角形に展開される)。
 *  残像を保持するテクスチャへ上下反転して描き (WebGL 版と同じ丸めになる)、反転を戻してキャンバスへ写す。
 *
 *  GPU 計算 (粒子が多いとき。状態は GPU 上に置いたまま):
 *    1) 各粒子のキーを2つ求め、セルごとの個数を原子加算で数える
 *       近傍用: (細かい行, 色, 細かい列) の順 / 担当用: 1px (最大辺が 1024 を超える画面では 最大辺/1024 px) 格子の
 *       ヒルベルト曲線順 (近い粒子が連続する)
 *    2) 個数の累積和 (2段) → 各セルの開始位置。粒子を並べ替えて詰める (計数ソート)
 *    3) 力: ヒルベルト順に連続する 32 粒子を1つの作業グループが受け持つ。
 *       各行について「32 粒子それぞれの半径 rMax の円の弦」の和集合の範囲だけを、色ごとに
 *       連続した区間として読み、64 個ずつ共有メモリに載せて全員で使う (係数は色ごとに1回)。
 *       空の区間は詰めて表にし、各レーンは今の区間をレジスタに持って順に進む。
 *       力の式は比較・選択を使わない形 (rMax・反発距離の外では自然に 0 になる)。
 *    4) 速度・位置を更新して書き戻す (粒子番号の位置へ直接)
 *  力の式・摩擦・破壊・トーラスは CPU 版と同じ (32bit 浮動小数のため丸め誤差の分だけ異なる)。
 *  並べ替えの順番 (同じセル内) は原子加算の順で毎回変わりうる → 足す順番による丸め誤差の分だけ揺らぐ。
 * ===================================================================== */
async function createWebGPUBackend() {
  if (!navigator.gpu) return null;
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) return null;
  const want = ['timestamp-query', 'subgroups'].filter((f) => adapter.features.has(f));
  const device = await adapter.requestDevice({
    requiredFeatures: want,
    requiredLimits: {
      maxStorageBufferBindingSize: Math.min(adapter.limits.maxStorageBufferBindingSize, 256 * 1024 * 1024),
      maxBufferSize: Math.min(adapter.limits.maxBufferSize, 256 * 1024 * 1024),
      maxTextureDimension2D: adapter.limits.maxTextureDimension2D,     // 超大画面でもキャンバスを作れるように
    },
  });
  // キャンバスの WebGPU コンテキストは、シェーダが全部通ったのを確かめてから取る
  // (一度取ると同じキャンバスで WebGL / 2D が使えなくなるため)
  let ctx = null;
  const FORMAT = 'rgba8unorm';
  device.lost.then((info) => {
    if (info.reason === 'destroyed') return;
    contextLost = true;
    showNotice('GPU がリセットされました。読み込み直します');
    setTimeout(() => location.reload(), 1500);
  });
  // 32 レーンの subgroup がそろう環境 (NVIDIA など) では接頭和を subgroup 命令で
  device.pushErrorScope('validation');                // 下で作るシェーダ・パイプラインの検証エラーを集める
  const info = adapter.info || {};
  const SG = device.features.has('subgroups') && info.subgroupMinSize === 32 && info.subgroupMaxSize === 32;
  const hasTs = device.features.has('timestamp-query');

  const U = GPUBufferUsage;
  const mkBuf = (size, usage) => device.createBuffer({ size: Math.max(16, Math.ceil(size / 16) * 16), usage });
  const typeBuf = mkBuf(MAX_COUNT * 4, U.STORAGE | U.COPY_DST);           // 描画と計算で共用
  const typeIo = new Uint32Array(MAX_COUNT);

  /* ---------------- 描画 ---------------- */
  const xBuf = mkBuf(MAX_COUNT * 4, U.STORAGE | U.COPY_DST);              // CPU 計算中の位置
  const yBuf = mkBuf(MAX_COUNT * 4, U.STORAGE | U.COPY_DST);
  const ruBuf = mkBuf(32, U.UNIFORM | U.COPY_DST);                         // world, half, alpha, mode
  const colBuf = mkBuf(MAX_TYPES * 16, U.UNIFORM | U.COPY_DST);
  const fadeBuf = [mkBuf(16, U.UNIFORM | U.COPY_DST), mkBuf(16, U.UNIFORM | U.COPY_DST)];
  // 点の描き方は WebGL 版 (ANGLE が点を四角形に広げる方法) にそろえる: 上下を反転した座標で描き
  // (最後に反転して表示)、四隅の順番・頂点の座標・指数関数の計算も同じ。こうすると頂点が 1/256 画素の
  // 格子に寄るときの丸めまで一致し、WebGL 版とほぼ同じ画素値になる (違いは 100k 粒子で 1/255 が十数画素)
  const drawSrc = `
    struct RU { world: vec2f, half: vec2f, alpha: f32, mode: u32, p0: u32, p1: u32 };
    @group(0) @binding(0) var<uniform> ru: RU;
    @group(0) @binding(1) var<uniform> colors: array<vec4f, ${MAX_TYPES}>;
    @group(0) @binding(2) var<storage, read> st: array<vec4f>;
    @group(0) @binding(3) var<storage, read> xs: array<f32>;
    @group(0) @binding(4) var<storage, read> ys: array<f32>;
    @group(0) @binding(5) var<storage, read> ty: array<u32>;
    struct VO { @builtin(position) pos: vec4f, @location(0) p: vec2f, @location(1) @interpolate(flat) col: vec3f };
    @vertex fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VO {
      var a: vec2f;
      if (ru.mode == 1u) { a = st[ii].xy; } else { a = vec2f(xs[ii], ys[ii]); }
      let clip = a / ru.world * 2.0 - 1.0;
      // 四隅: (+,-) (+,+) (-,-) (-,+) の順 (ANGLE と同じ。対角線の向きもそろう)
      let c = vec2f(select(-1.0, 1.0, vi < 2u), select(-1.0, 1.0, (vi & 1u) == 1u));
      var o: VO;
      o.pos = vec4f(clip.x + c.x * ru.half.x, clip.y + c.y * ru.half.y, 0.0, 1.0);   // 上下反転した座標
      o.p = vec2f(c.x * 0.5 + 0.5, 0.5 - c.y * 0.5);   // gl_PointCoord と同じ (0..1)
      o.col = colors[ty[ii]].xyz;
      return o;
    }
    @fragment fn fs(i: VO) -> @location(0) vec4f {
      let p = i.p * 2.0 - 1.0;
      let d2 = dot(p, p);
      if (d2 > 1.0) { discard; }
      // 明るい芯 + 柔らかい外周 (WebGL 版と同じ式。exp(-5 d2) = exp2(d2 × -5 log2 e))
      let glow = fma(1.0 - d2, 0.15, exp2(d2 * -7.213475204444817));
      return vec4f(i.col * glow * ru.alpha, 1.0);
    }
    @group(0) @binding(0) var<uniform> fadeColor: vec4f;
    @vertex fn vsq(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4f {
      return vec4f(f32(vi & 1u) * 2.0 - 1.0, f32(vi >> 1u) * 2.0 - 1.0, 0.0, 1.0);
    }
    @fragment fn fsq() -> @location(0) vec4f { return fadeColor; }

      let idx = meI;
      let st = state[idx];
      var v = st.zw * u.friction + f * u.accScale;
      if (u.inputOn != 0u) {                          // 「破壊」
        var d = st.xy - u.inp;
        let hw = u.world * 0.5;
        if (d.x > hw.x) { d.x -= u.world.x; } else if (d.x < -hw.x) { d.x += u.world.x; }
        if (d.y > hw.y) { d.y -= u.world.y; } else if (d.y < -hw.y) { d.y += u.world.y; }
        let d2 = dot(d, d);
        if (d2 < u.pr * u.pr && d2 > 1e-6) {
          let dist = sqrt(d2);
          v += d * ((1.0 - dist / u.pr) * u.pf * u.dt / dist);
        }
      }
      var p = st.xy + v * u.dt;
      p.x = wrapAxis(p.x, u.world.x);
      p.y = wrapAxis(p.y, u.world.y);
      state[idx] = vec4f(p, v);
    }`;
  const mkComp = (code, label) => device.createComputePipeline({
    layout: 'auto', label, compute: { module: device.createShaderModule({ code, label }), entryPoint: 'main' },
  });
  const CP = {
    key: mkComp(keySrc, 'key'), scanA: mkComp(scanASrc, 'scanA'), scanB: mkComp(scanBSrc, 'scanB'), scanC: mkComp(scanCSrc, 'scanC'),
    scatter: mkComp(scatterSrc, 'scatter'), force: mkComp(forceSrc, 'force'), scale: mkComp(scaleSrc, 'scale'),
  };
  const bindAll = (p, list) => device.createBindGroup({
    layout: p.getBindGroupLayout(0), entries: list.map((b, i) => ({ binding: i, resource: { buffer: b } })),
  });
  const BG = {
    key: bindAll(CP.key, [uni, stateBuf, typeBuf, countsN, countsH, krN, krH]),
    scanAN: bindAll(CP.scanA, [suN, countsN, blkN]), scanBN: bindAll(CP.scanB, [suN, blkN]), scanCN: bindAll(CP.scanC, [suN, countsN, blkN]),
    scanAH: bindAll(CP.scanA, [suH, countsH, blkH]), scanBH: bindAll(CP.scanB, [suH, blkH]), scanCH: bindAll(CP.scanC, [suH, countsH, blkH]),
    scatter: bindAll(CP.scatter, [uni, stateBuf, typeBuf, krN, krH, countsN, countsH, sortedN, sortedH]),
    force: bindAll(CP.force, [uni, stateBuf, sortedH, sortedN, countsN, pairBuf]),
    scale: bindAll(CP.scale, [uni, stateBuf]),

  const uniIo = new ArrayBuffer(112), uF = new Float32Array(uniIo), uU = new Uint32Array(uniIo);

  const pairIo = new Float32Array(MAX_TYPES * MAX_TYPES * 4);
  let cols = 1, rows = 1, cw = 1, ch = 1, hg = 1, hgx = 1, hgy = 1, hN = 1;
  const part1by1 = (v) => { v &= 0xffff; v = (v | (v << 8)) & 0x00ff00ff; v = (v | (v << 4)) & 0x0f0f0f0f; v = (v | (v << 2)) & 0x33333333; v = (v | (v << 1)) & 0x55555555; return v >>> 0; };
  /** 格子の寸法 (セル数が上限を超える巨大な画面では粗くする) */
  function grid() {
    hg = Math.max(1, Math.max(worldW, worldH) / 1024);       // 並べ順 (ヒルベルト曲線) の格子は 1024×1024 以下
    hgx = Math.max(1, Math.ceil(worldW / hg)); hgy = Math.max(1, Math.ceil(worldH / hg));
    hN = 1; while (hN < Math.max(hgx, hgy)) hN *= 2;          // ヒルベルト曲線の一辺 (2 のべき)
    for (let k = 0; k < 8; k++) {
      const sy = Math.max(1, SUBY >> k), sx = Math.max(1, SUBX >> k);
      const c = Math.max(1, Math.floor(worldW * sx / params.rMax)), r = Math.max(1, Math.floor(worldH * sy / params.rMax));
      if (c * r * numTypes <= MAX_CELLS) { cols = c; rows = r; cw = worldW / c; ch = worldH / r; return true; }
    }
    return false;
  }
  function writeUniforms(dt, friction, accScale, n) {
    uF[0] = worldW; uF[1] = worldH; uF[2] = cw; uF[3] = ch;
    uU[4] = cols; uU[5] = rows; uU[6] = n; uU[7] = numTypes;
    uF[8] = params.rMax; uF[10] = friction; uF[11] = accScale;
    uF[12] = dt; uF[13] = params.pointerRadius; uF[14] = params.pointerForce; uU[15] = input.active ? 1 : 0;
    uF[16] = input.x; uF[17] = input.y; uF[18] = hg;
    uU[20] = hgx; uU[21] = hgy; uU[22] = hN;
    device.queue.writeBuffer(uni, 0, uniIo);
  }
  let active = false, enterCount = 0, exiting = false;
  let stepNo = 0, tsPending = false, gpuMs = 0;
  const stIo = new Float32Array(MAX_COUNT * 4);
  const sim = {
    get active() { return active; },
    get enterCount() { return enterCount; },
    /** GPU → CPU の読み戻し中 (この間はシミュレーションを進めない) */
    get busy() { return exiting; },
    /** 直近に測った GPU 計算時間 [ms] (測れない環境では 0) */
    get gpuMs() { return gpuMs; },
    get drawInfo() { return { gpuMs, cols, rows, sg: SG }; },
    texW: 0,
    fits() { return grid(); },
    /** 粒子 [from, to) を CPU 側の配列から GPU に送る (位置・速度・色) */
    uploadRange(from, to) {
      if (to <= from) return;
      for (let i = from; i < to; i++) {
        stIo[i * 4] = posX[i]; stIo[i * 4 + 1] = posY[i]; stIo[i * 4 + 2] = velX[i]; stIo[i * 4 + 3] = velY[i];
        typeIo[i] = type[i];
      }
      device.queue.writeBuffer(stateBuf, from * 16, stIo, from * 4, (to - from) * 4);
      device.queue.writeBuffer(typeBuf, from * 4, typeIo, from, to - from);
      simVersion++;
    },
    /** 色だけ送り直す (色の数を変えたとき。位置は GPU 上のまま) */
    uploadTypes(from, to) {
      for (let i = from; i < to; i++) typeIo[i] = type[i];
      device.queue.writeBuffer(typeBuf, from * 4, typeIo, from, to - from);
      simVersion++;
    },
    enter() {
      if (active || exiting || !grid()) return;
      sim.uploadRange(0, params.count);
      active = true; enterCount = params.count;
    },
    /** CPU 計算に戻る: 状態を読み戻してから切り替える (非同期。終わるまで busy) */
    exit() {
      if (!active || exiting) return;
      exiting = true;
      const n = params.count, w0 = worldW, h0 = worldH;
      const enc = device.createCommandEncoder();
      enc.copyBufferToBuffer(stateBuf, 0, readBuf, 0, n * 16);
      device.queue.submit([enc.finish()]);
      readBuf.mapAsync(GPUMapMode.READ, 0, n * 16).then(() => {
        const a = new Float32Array(readBuf.getMappedRange(0, n * 16));
        for (let i = 0; i < n; i++) { posX[i] = a[i * 4]; posY[i] = a[i * 4 + 1]; velX[i] = a[i * 4 + 2]; velY[i] = a[i * 4 + 3]; }
        readBuf.unmap();
        if (worldW !== w0 || worldH !== h0) {         // 読み戻しの間に画面サイズが変わった: CPU 版の resize と同じ式で合わせる

          for (let i = 0; i < n; i++) { posX[i] = Math.min(posX[i] * sx, worldW - 1e-3); posY[i] = Math.min(posY[i] * sy, worldH - 1e-3); }
        }
        active = false; exiting = false;
        simVersion++; idleFrames = 0;
        refreshEngineLabel();
      }, (e) => { console.warn('GPU からの読み戻しに失敗:', e); exiting = false; });
    },
    rescale(sx, sy) {
      uF[24] = sx; uF[25] = sy;
      writeUniforms(0, 1, 0, params.count);
      const enc = device.createCommandEncoder();
      const p = enc.beginComputePass();
      p.setPipeline(CP.scale); p.setBindGroup(0, BG.scale); p.dispatchWorkgroups(Math.ceil(params.count / 256));
      p.end();
      device.queue.submit([enc.finish()]);
      simVersion++;
    },
    noteFrameMs() {},
    /** 1 ステップ進める。measure = true のときはこのステップの GPU 時間 [ms] を返す (計測用) */
    step(dt, friction, accScale, measure = false) {
      if (!grid()) return;
      const n = params.count, nT = numTypes;
      const nCellsN = cols * rows * nT, nCellsH = hN * hN;
      writeUniforms(dt, friction, accScale, n);
      const nbN = Math.ceil((nCellsN + 1) / 1024), nbH = Math.ceil((nCellsH + 1) / 1024);
      suIo[0] = nCellsN + 1; suIo[1] = nbN; device.queue.writeBuffer(suN, 0, suIo);
      suIo[0] = nCellsH + 1; suIo[1] = nbH; device.queue.writeBuffer(suH, 0, suIo);
      // 色の組ごとの定数: m, 1/(R·β), 山の位置 R(1+β)/2, 1/半幅 2/(R(1-β))  (R, β は組ごとの影響範囲)
      for (let k = 0; k < nT * nT; k++) {
        const R = params.rMax * pairMax[k], b = pairMin[k];
        pairIo[k * 4] = matrix[k]; pairIo[k * 4 + 1] = 1 / (R * b);
        pairIo[k * 4 + 2] = R * (1 + b) * 0.5; pairIo[k * 4 + 3] = 2 / (R * (1 - b));

      const enc = device.createCommandEncoder();
      enc.clearBuffer(countsN, 0, Math.ceil((nCellsN + 1) / 4) * 16);
      enc.clearBuffer(countsH, 0, Math.ceil((nCellsH + 1) / 4) * 16);
      const p = enc.beginComputePass(timed ? { timestampWrites: { querySet: qs, beginningOfPassWriteIndex: 0, endOfPassWriteIndex: 1 } } : undefined);
